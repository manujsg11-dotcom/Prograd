<div id="root"></div>
<script>
const {useState,useEffect,useRef}=React;
const html=htm.bind(React.createElement);
const KEY='gym-notes-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const mkSet=(kg='',reps='')=>({id:uid(),kg,reps,done:false});

/* ===== Rutinas A (4 días) y C (3 días) del PDF «Rutina de hipertrofia» ===== */
/* tgt: s = series, lo–hi = rango de reps, inc = kg que se suben, big = básico (descanso 2–3') */
const T=(s,lo,hi,inc,big)=>({s,lo,hi,inc,big});
const ex2=(name,t,kg='')=>({id:uid(),type:'exercise',name,tgt:t,sets:Array.from({length:t.s},()=>mkSet(kg,''))});
const txt=t=>({id:uid(),type:'text',text:t});
const WT="Calentamiento 5': cinta o elíptica + movilidad, y 1–2 series de aproximación en el primer ejercicio. Al final: 15' andar en cinta inclinada.";
const WL="Calentamiento 5': bici o elíptica + movilidad de cadera y tobillo, y 1–2 series de aproximación en el primer ejercicio. Al final: 15' andar en cinta inclinada.";
const CURL="Curl femoral: punta del pie hacia ti para evitar calambres en los gemelos; si siguen, curl femoral de pie en polea con tobillera.";
const ABS="Abdominales: crunch en polea con carga o elevación de piernas colgado.";
const TA=[['Press plano en máquina',T(3,6,10,2.5,1)],['Dominadas lastradas',T(3,5,8,1.25,1)],['Press de hombro en máquina',T(3,8,10,2.5,1)],['Remo con pecho apoyado',T(3,8,10,2.5,1)],['Fondos lastrados',T(3,8,10,1.25,1)],['Elevaciones laterales',T(3,12,15,1,0)],['Curl de bíceps',T(2,10,12,1,0)]];
const TB=[['Press inclinado con mancuernas',T(3,8,10,2,1)],['Dominadas lastradas neutras',T(3,6,10,1.25,1)],['Remo en polea baja',T(3,10,12,2.5,1)],['Elevaciones laterales',T(3,15,20,1,0)],['Pec deck invertido',T(3,12,15,2.5,0)],['Extensión de tríceps en polea',T(3,10,12,2.5,0)],['Curl inclinado o martillo',T(3,10,12,1,0)],['Abdominales',T(3,10,15,2.5,0)]];
const LA=[['Búlgaras',T(3,8,10,2,1)],['Prensa',T(3,8,10,5,1)],['Curl femoral tumbado',T(3,10,12,2.5,0)],['Extensión de cuádriceps',T(2,10,12,2.5,0)],['Gemelos',T(3,12,15,5,0)]];
const LB=[['Prensa con pies altos',T(3,10,12,5,1)],['Curl femoral tumbado',T(3,10,12,2.5,0)],['Gemelos',T(3,12,15,5,0)],['Abdominales',T(3,10,15,2.5,0)]];
const LC=[['Búlgaras',T(3,8,10,2,1)],['Prensa',T(3,8,10,5,1)],['Curl femoral tumbado',T(4,10,12,2.5,0)],['Extensión de cuádriceps',T(2,10,12,2.5,0)],['Gemelos',T(3,12,15,5,0)],['Abdominales',T(3,10,15,2.5,0)]];
const PLANS={
 A:{name:'Rutina A',sub:'4 días',days:[['Día 1 — Torso A',WT,TA],['Día 2 — Pierna A',WL+' '+CURL,LA],['Día 3 — Torso B',WT+' '+ABS,TB],['Día 4 — Pierna B',WL+' '+ABS,LB]]},
 C:{name:'Rutina C',sub:'3 días',days:[['Día 1 — Torso A',WT,TA],['Día 2 — Pierna',WL+' '+CURL+' '+ABS,LC],['Día 3 — Torso B',WT+' '+ABS,TB]]}};
const planNotes=(kgOf=()=>'')=>{const now=Date.now(),out=[];['A','C'].forEach((p,pi)=>PLANS[p].days.forEach(([title,note,exs],i)=>out.push({id:uid(),title,tags:[PLANS[p].name],plan:p,day:i+1,updated:now-(pi*10+i)*1000,blocks:[txt(note),...exs.map(([n,t])=>ex2(n,{...t},kgOf(n,t)))]})));return out};
const seed=()=>planNotes();
/* Paso a A y C conservando las rutinas antiguas (con su historial) y empezando con tus últimos pesos */
const ALIAS={'press plano en maquina':['press banca','press plano','press banca maquina','press plano maquina'],'dominadas lastradas':['dominadas lastradas','dominadas'],'dominadas lastradas neutras':['dominadas lastradas neutras','dominadas lastradas','dominadas'],'press de hombro en maquina':['maquina press militar','press militar maquina','press hombro maquina','press de hombro'],'fondos lastrados':['fondos lastrados','fondos'],'press inclinado con mancuernas':['press inclinado mancuernas','press inclinado'],'elevaciones laterales':['elevaciones laterales','laterales en polea','laterales'],'bulgaras':['bulgaras mancuernas','bulgaras','sentadilla bulgara'],'prensa':['prensa'],'curl femoral tumbado':['curl femoral tumbado','femoral','curl femoral'],'extension de cuadriceps':['extension de cuadriceps','quadriceps','cuadriceps'],'gemelos':['gemelos']};
function kgFrom(old,name,t){
 const keys=ALIAS[norm(name)]||[norm(name)];let best=null;
 old.forEach(n=>{(n.hist||[]).forEach(h=>{if(h.demo)return;(h.ex||[]).forEach(e=>{if(keys.includes(norm(e.n))&&(!best||h.t>best.t))best={t:h.t,s:e.s}})});
  n.blocks.forEach(b=>{if(b.type!=='exercise'||!keys.includes(norm(b.name)))return;const d=b.sets.filter(x=>x.done&&N(x.kg)>0&&N(x.reps)>0);if(!d.length)return;const tt=Math.max(...d.map(x=>x.doneAt||n.updated));if(!best||tt>best.t)best={t:tt,s:d.map(x=>[N(x.kg),N(x.reps)])}})});
 if(!best)return'';
 const ok=best.s.filter(x=>x[1]>=t.lo&&x[0]>0);
 const kg=ok.length?Math.max(...ok.map(x=>x[0])):toInc(Math.max(...best.s.map(x=>x[0]))*0.9,t.inc||1);
 return kg>0?fN(kg):'';
}
function migrate(notes){
 const old=notes.filter(n=>!n.plan);
 const fresh=planNotes((name,t)=>kgFrom(old,name,t));
 return[...fresh,...old.map(n=>({...n,tags:[...new Set([...(n.tags||[]).filter(t=>t!=='Rutina'),'Antiguas'])],updated:(n.updated||0)+1}))];
}
/* Semana de descarga: mitad de series y −10 % de peso; los pesos de antes se guardan para volver a ellos */
const dlSets=t=>Math.max(1,Math.round(t.s/2));
const startDl=n=>{let ch=false;const blocks=n.blocks.map(b=>{if(b.type!=='exercise'||!b.tgt||b.dl)return b;ch=true;const kg=Math.max(0,...b.sets.map(x=>N(x.kg))),nk=kg>0?fN(toInc(kg*0.9,b.tgt.inc||1)):'';return{...b,dl:{sets:b.sets.map(x=>({...x,done:false,doneAt:null}))},sets:Array.from({length:dlSets(b.tgt)},()=>mkSet(nk,''))}});return ch?{...n,blocks,updated:Date.now()}:n};
const endDl=n=>{let ch=false;const blocks=n.blocks.map(b=>{if(!b.dl)return b;ch=true;const{dl,...r}=b;return{...r,sets:dl.sets.map(x=>({...x,done:false,doneAt:null}))}});return ch?{...n,blocks,updated:Date.now()}:n};
const CFG0={v:0,plan:'A',pins:null,pinSel:'',deload:0,lastDeload:0,lastExport:0,at:0};
const loadCfg=()=>{try{const c=JSON.parse(localStorage.getItem('gym-cfg')||'null');if(c&&typeof c==='object')return{...CFG0,...c}}catch(e){}return{...CFG0}};
const loadMeas=()=>{try{const m=JSON.parse(localStorage.getItem('gym-meas')||'[]');if(Array.isArray(m))return m}catch(e){}return[]};
let SEEDMAP={};
const load=()=>{try{const r=localStorage.getItem(KEY);if(r){const v=JSON.parse(r);if(Array.isArray(v))return v}}catch(e){}if(window.claude)return[];const s=seed();SEEDMAP=Object.fromEntries(s.map(n=>[n.id,n.updated]));try{localStorage.setItem('gym-seed-ids',JSON.stringify(SEEDMAP))}catch(e){}return s};
const N=v=>{const x=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(x)?x:0};
const fN=x=>String(Math.round(x*100)/100).replace('.',',');
const fmtK=n=>n>=1000?(n/1000).toFixed(1).replace('.',',')+'k':String(Math.round(n));
const clone=n=>JSON.parse(JSON.stringify(n));
const reid=b=>{b.id=uid();(b.sets||[]).forEach(s=>s.id=uid());(b.items||[]).forEach(s=>s.id=uid());return b};
const clear=n=>{n.blocks.forEach(b=>{(b.sets||[]).forEach(s=>s.done=false);(b.items||[]).forEach(s=>s.done=false)});return n};
const day0=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const ago=t=>{const d=Math.round((day0(Date.now())-day0(t))/864e5);return d<=0?'hoy':d===1?'ayer':'hace '+d+' días'};
const isEmpty=n=>!n.blocks.length&&!(n.hist&&n.hist.length)&&(!(n.title||'').trim()||n.title==='Nueva sesión');

/* ===== Sistema de progresión (doble progresión) ===== */
const rnd=x=>Math.round(x*100)/100;
const toInc=(x,inc)=>Math.max(0,rnd(Math.round(x/inc)*inc));
const restOf=t=>t.big?"2–3'":"1–2'";
/* cur/prev = [[kg,reps],...] de la última y la penúltima sesión */
function prog(t,cur,prev){
 if(!t||!cur||!cur.length)return null;
 const kg=Math.max(...cur.map(x=>x[0])),reps=cur.map(x=>x[1]).join(' · ');
 if(cur.length>=t.s&&cur.every(x=>x[1]>=t.hi)){const nk=rnd(kg+t.inc);return{k:'up',kg:nk,from:kg,msg:'Sube a '+fN(nk)+' kg',why:'Llegaste a '+t.hi+' reps en todas las series ('+reps+')'}}
 const low=cur.some(x=>x[1]<t.lo);
 if(low&&prev&&prev.length&&prev.some(x=>x[1]<t.lo)&&Math.max(...prev.map(x=>x[0]))===kg){const nk=toInc(kg*0.9,t.inc);return{k:'down',kg:nk,from:kg,msg:'Baja a '+fN(nk)+' kg',why:'Dos sesiones sin llegar a '+t.lo+' reps: baja un 10 % y vuelve a subir'}}
 if(low)return{k:'hold',kg,from:kg,msg:'Mantén '+fN(kg)+' kg',why:'Busca al menos '+t.lo+' reps en todas las series ('+reps+')'};
 return{k:'reps',kg,from:kg,msg:'Mantén '+fN(kg)+' kg y suma reps',why:'Cuando hagas '+t.hi+' en todas, toca subir ('+reps+')'};
}
/* Historial de un ejercicio dentro de una rutina, de más reciente a más antiguo */
const histOf=(note,name)=>{const k=norm(name),h=note.hist||[],out=[];if(!k)return out;for(let i=h.length-1;i>=0;i--){if(h[i].dl)continue;const e=(h[i].ex||[]).find(x=>norm(x.n)===k);if(e)out.push({t:h[i].t,s:e.s,demo:h[i].demo})}return out};
const fitSets=(b,kg)=>{const t=b.tgt,sets=b.sets.map(s=>({...s,kg:fN(kg),reps:'',done:false}));while(t&&sets.length<t.s)sets.push(mkSet(fN(kg),''));return sets};
const isApplied=(b,p)=>p&&(p.k==='up'||p.k==='down')&&b.sets.length>0&&b.sets.every(s=>Math.abs(N(s.kg)-p.kg)<0.01);

/* Reconocimiento de músculos */
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const MUS={chest:'Pecho',back:'Espalda',traps:'Trapecio',shoulders:'Hombros',biceps:'Bíceps',triceps:'Tríceps',forearms:'Antebrazos',core:'Abdomen',lumbar:'Lumbar',quads:'Cuádriceps',hams:'Isquios',glutes:'Glúteos',calves:'Gemelos',other:'Otros'};
const DB=[
 ['press de pecho,press pecho,chest press,press en maquina,press maquina pecho',['chest'],['shoulders','triceps']],

 ['clean,cargada,arranque,snatch,kettlebell swing,swing',['glutes','hams','back'],['quads','shoulders','core']]];
const lev=(a,b)=>{const d=Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]};
const detect=name=>{
 const n=norm(name),tk=n.split(' ').filter(Boolean);let best=null,bs=0;
 DB.forEach(e=>e[0].split(',').forEach(kw=>{
  const m=kw.split(' ').length;let sc=0;
  if(kw.length<=4)sc=tk.some(t=>t===kw||t===kw+'s')?kw.length+1:0;
  else if(n.includes(kw))sc=kw.length+1;
  else{const tol=kw.length>=9?2:kw.length>=5?1:0;for(let i=0;i+m<=tk.length;i++)if(lev(tk.slice(i,i+m).join(' '),kw)<=tol){sc=kw.length;break}}
  if(sc>bs){bs=sc;best=e}}));
 return best?{ag:best[1],st:best[2]}:{ag:[],st:[]};
};
const muscles=b=>b.mu?{...b.mu,auto:false}:{...detect(b.name),auto:true};
const isBig=name=>/press banca|bench|sentadilla|squat|prensa|peso muerto|deadlift|hip thrust|militar|remo|row/.test(norm(name));

/* Discos */
const PL=[[25,'#f5f5f5'],[20,'#d4d4d4'],[15,'#b0b0b0'],[10,'#8c8c8c'],[5,'#6a6a6a'],[2.5,'#4d4d4d'],[1.25,'#3a3a3a']];
const calcPlates=(kg,bar)=>{let r=(kg-bar)/2;const out=[],side=r;if(r<0)return{out,left:0,side};for(const[p]of PL){const c=Math.floor(r/p+1e-9);if(c){out.push([p,c]);r-=c*p}}return{out,left:Math.round(r*100)/100,side}};
function Plates({b,set}){
 const bar=b.bar==null?20:b.bar;
 const cur=b.sets.find(s=>!s.done&&N(s.kg)>0)||[...b.sets].reverse().find(s=>N(s.kg)>0);
 if(!cur)return html`<div className="field p-3 mb-3 text-sm mut">Introduce un peso en kg para ver los discos.</div>`;
 const kg=N(cur.kg),{out,left,side}=calcPlates(kg,bar);
 const items=[];out.forEach(([p,c])=>{const col=PL.find(q=>q[0]===p)[1],w=p>=10?16:p>=5?12:8,h=Math.min(78,22+p*2.6);for(let k=0;k<c;k++)items.push([w,h,col])});
 const tot=items.reduce((a,i)=>a+i[0]+2,0),f=Math.min(1,100/Math.max(tot,1));
 let xr=190,xl=110;const rects=[];
 items.forEach(([w,h,col],k)=>{const ww=w*f,st={animationDelay:k*70+'ms'};
  rects.push(html`<rect key=${'r'+k} className="pop-in" style=${st} x=${xr} y=${45-h/2} width=${ww} height=${h} rx="3" fill=${col}/>`);
  rects.push(html`<rect key=${'l'+k} className="pop-in" style=${st} x=${xl-ww} y=${45-h/2} width=${ww} height=${h} rx="3" fill=${col}/>`);
  xr+=ww+2*f;xl-=ww+2*f});
 return html`<div className="field p-3 mb-3">
  <div className="flex items-center justify-between text-sm mb-1"><span className="mut">Serie ${b.sets.indexOf(cur)+1} · <b className="text-white num">${fN(kg)} kg</b></span>
   <span className="flex gap-1">${[20,15,0].map(v=>html`<button key=${v} onClick=${()=>set({...b,bar:v})} className=${'h-7 px-2.5 rounded-full text-xs '+(bar===v?'bg-neutral-200 text-black':'chip mut')}>${v?v+' kg':'Sin barra'}</button>`)}</span></div>
  <svg viewBox="0 0 300 90" className="w-full"><rect x="6" y="42" width="288" height="6" rx="3" fill="#3a3a3a"/><rect x="2" y="39" width="112" height="12" rx="3" fill="#555"/><rect x="186" y="39" width="112" height="12" rx="3" fill="#555"/><rect x="146" y="34" width="8" height="22" rx="2" fill="#777"/>${rects}</svg>
  ${side<0?html`<p className="text-sm mut">Menos que la barra (${bar} kg).</p>`:html`<p className="text-sm mut">Mismos discos en cada lado (<span className="num">${fN(side)}</span> kg por lado): ${out.length?out.map(([p,c])=>html`<b key=${p} className="inline-block mr-2 text-white num">${c}×${fN(p)}</b>`):'solo barra'}${out.length?html`<span> · ${out.reduce((a,x)=>a+x[1],0)*2} discos en total</span>`:''}${left>0?html`<span> · faltan ${fN(left)} kg por lado</span>`:''}</p>`}
 </div>`;
}

function Anatomy({b,set}){
 const {ag,st}=muscles(b);const [sel,setSel]=useState(null);const [ed,setEd]=useState(false);
 const state=id=>ag.includes(id)?2:st.includes(id)?1:0;
 const fill=id=>['#262626','#7a7a7a','#f5f5f5'][state(id)];

  ${ed&&html`<div className="mt-2 push-in"><div className="flex flex-wrap gap-1.5">${Object.keys(MUS).filter(k=>k!=='other').map(k=>html`<button key=${k} onClick=${()=>cycle(k)} className=${'h-8 px-3 rounded-full text-sm '+['chip mut','bg-neutral-600 text-white','bg-neutral-200 text-black'][state(k)]}>${MUS[k]}</button>`)}</div>
   <p className="text-xs mut mt-2">Toca para alternar: sin marcar → estabilizador → agonista.${b.mu?html` <button onClick=${()=>{const{mu,...r}=b;set(r)}} className="underline text-neutral-300">Restablecer</button>`:''}</p></div>`}
 </div>`;
}

/* ===== Objetivo y progresión en cada ejercicio ===== */
function TargetEdit({b,set}){

/* Bloques */
function Exercise({b,set,hist,best,remember,dl}){
 const [open,setOpen]=useState(null);
 const up=(id,p)=>set({...b,sets:b.sets.map(s=>s.id===id?{...s,...p}:s)});
 const add=()=>{const l=b.sets[b.sets.length-1];set({...b,sets:[...b.sets,mkSet(l?l.kg:'',l?l.reps:'')]})};
 const del=id=>{remember('Serie borrada');set({...b,sets:b.sets.filter(x=>x.id!==id)})};
 const done=b.sets.filter(s=>s.done).length;
 const last=hist[0]||null,prev=hist[1]||null,t=b.tgt;
 const p=t&&last?prog(t,last.s,prev&&prev.s):null;

  <div className="flex items-center gap-2 my-3 flex-wrap">${[['t','Objetivo'],['p','Discos'],['m','Músculos']].map(([k,l])=>html`<button key=${k} onClick=${()=>{if(k==='t'&&!t)set({...b,tgt:T(3,8,12,2.5,isBig(b.name)?1:0)});setOpen(open===k?null:k)}} className=${'h-8 px-4 rounded-full text-sm '+(open===k?'bg-neutral-200 text-black':'chip mut')}>${k==='t'&&!t?'+ Objetivo':l}</button>`)}

  ${open==='p'&&html`<${Plates} b=${b} set=${set}/>`}${open==='m'&&html`<${Anatomy} b=${b} set=${set}/>`}

  <div className="space-y-2">
  ${b.sets.map((s,i)=>html`<div key=${s.id} className="grid grid-cols-[1.5rem_1fr_1fr_2.75rem_1.5rem] gap-2 items-center pop-in">

function activity(notes){
 const cut=Date.now()-7*864e5,cut30=Date.now()-30*864e5,days=new Set(),sets={},vol={},st={};let wS=0,wV=0,w30=0;
 notes.forEach(n=>{
  (n.hist||[]).forEach(h=>{if(h.demo)return;days.add(day0(h.t));if(h.t>=cut30)w30++;if(h.t>=cut){wS+=h.sets;wV+=h.vol;Object.entries(h.m||{}).forEach(([g,x])=>{sets[g]=(sets[g]||0)+x.s;vol[g]=(vol[g]||0)+x.v});(h.st||[]).forEach(g=>st[g]=1)}});
  n.blocks.forEach(b=>{if(b.type!=='exercise')return;const m=muscles(b);b.sets.forEach(x=>{if(!x.done)return;const t=x.doneAt||n.updated;days.add(day0(t));if(t<cut)return;const v=N(x.kg)*N(x.reps);wS++;wV+=v;m.ag.forEach(g=>{sets[g]=(sets[g]||0)+1;vol[g]=(vol[g]||0)+v});m.st.forEach(g=>st[g]=1)})})});

 const vol={},ms={},stb=new Set(),ex=[];let nS=0,tot=0;
 note.blocks.filter(b=>b.type==='exercise').forEach(b=>{const d=doneSets(b);if(!d.length)return;const m=muscles(b),gs=m.ag.length?m.ag:['other'];m.st.forEach(g=>stb.add(g));
  ex.push({n:b.name,s:d.map(s=>[N(s.kg),N(s.reps)])});
  d.forEach(s=>{const v=N(s.kg)*N(s.reps);nS++;tot+=v;gs.forEach(g=>{vol[g]=(vol[g]||0)+v;ms[g]=(ms[g]||0)+1})})});

}
/* Plan de la próxima sesión a partir de lo que se acaba de hacer */
const planOf=note=>note.blocks.filter(b=>b.type==='exercise'&&b.tgt).map(b=>{const d=doneSets(b);if(!d.length)return null;const h=histOf(note,b.name);return{id:b.id,name:b.name,p:prog(b.tgt,d.map(s=>[N(s.kg),N(s.reps)]),h[0]&&h[0].s)}}).filter(x=>x&&x.p);

/* Gesto de iPhone en ventanas: deslizar desde el borde izquierdo para volver */
function useSwipeBack(onBack){

 const stop=e=>{if(e&&e.stopPropagation)e.stopPropagation()};
 const start=e=>{stop(e);const t=e.touches[0];s.current=(e.touches.length===1&&t.clientX<=28)?{x:t.clientX,y:t.clientY,t:Date.now(),dx:0,on:false}:null};
 const move=e=>{stop(e);const c=s.current,n=el.current;if(!c||!n)return;const t=e.touches[0],dx=t.clientX-c.x,dy=t.clientY-c.y;
  if(!c.on){if(Math.abs(dy)>10&&Math.abs(dy)>dx){s.current=null;return}if(dx<8)return;c.on=true}
  c.dx=Math.max(0,dx);n.style.transition='none';n.style.transform='translateX('+c.dx+'px)'};
 const end=e=>{stop(e);const c=s.current,n=el.current;s.current=null;if(!c||!c.on||!n)return;const w=window.innerWidth,v=c.dx/Math.max(1,Date.now()-c.t);
  n.style.transition='transform .28s cubic-bezier(.32,.72,0,1)';
  if(c.dx>w*0.33||(v>0.5&&c.dx>40)){n.style.transform='translateX('+w+'px)';setTimeout(onBack,240)}
  else{n.style.transform='';setTimeout(()=>{if(el.current)el.current.style.transition=''},300)}};
 return{ref:el,on:{onTouchStart:start,onTouchMove:move,onTouchEnd:end,onTouchCancel:end}};
}

const pinTags=(notes,cfg)=>{const have=new Set(notes.flatMap(n=>n.tags||[]));return(Array.isArray(cfg.pins)?cfg.pins:['Rutina A','Rutina C']).filter(t=>have.has(t))};
/* ===== Rangos por músculo (según el peso que levantas) ===== */
const RANKS=[['Hierro','#8b9099'],['Bronce','#c27c48'],['Plata','#cfd6de'],['Oro','#f0b92b'],['Platino','#35c7c1'],['Diamante','#a67cf5'],['Ascendente','#3fc07c'],['Inmortal','#ee4b55'],['Radiante','#ffe9a3']];
const REFS=[[/triceps|frances|skull|pushdown/,1],[/gemelo|calf|talon/,3],[/femoral|leg curl/,1.3],[/martillo|hammer/,.55],[/curl|biceps/,.9],[/press militar|overhead|press de hombro|press hombro|shoulder press/,1.3],[/elevacion|lateral|pajaro|face pull|facepull/,.5],[/inclinado|incline/,1.6],[/apertura|fly|cruce|contractor|pec deck/,.9],[/press banca|bench|press plano|press de pecho|chest press/,2],[/fondos|dip/,1.8],[/dominada|pull up|pullup|chin/,1.6],[/jalon|pulldown|remo|row/,1.9],[/rumano|rdl/,2.6],[/peso muerto|deadlift/,3.2],[/hip thrust|puente de gluteo/,3.5],[/sentadilla|squat/,2.8],[/prensa|leg press/,5.5],[/zancada|lunge|bulgara|split/,1.6],[/extension de cuadriceps|leg extension/,1.6],[/abdominal|crunch|plancha/,1]];
const refRatio=(k,big)=>{for(const [re,r] of REFS)if(re.test(k))return r;return big?1.6:1};
const bestsOf=(notes,cfg,extra)=>{const out={},put=(k,e)=>{if(k&&e>0&&(!out[k]||e>out[k]))out[k]=e};
 Object.entries((cfg&&cfg.bestGone)||{}).forEach(([k,e])=>put(k,e));
 notes.forEach(n=>{Object.entries(n.best||{}).forEach(([k,e])=>put(k,e));(n.hist||[]).forEach(h=>{if(h.demo)return;(h.ex||[]).forEach(x=>(x.s||[]).forEach(([kg,r])=>put(norm(x.n),e1(kg,r))))})});
 (extra||[]).forEach(x=>(x.s||[]).forEach(([kg,r])=>put(norm(x.n),e1(kg,r))));return out};
const muscleF=(bests,bw)=>{const mf={};Object.entries(bests).forEach(([k,e])=>{const d=detect(k),f=(e/bw)/refRatio(k,isBig(k));(d.ag||[]).forEach(g=>{if(MUS[g]&&g!=='other')mf[g]=Math.max(mf[g]||0,f)})});return mf};
const stepFp=fp=>{fp=Math.max(0,Math.min(1,fp));const raw=fp*25,step=Math.min(24,Math.floor(raw));return{step,fp,frac:step>=24?1:raw-step,tier:Math.min(8,Math.floor(step/3)),div:step%3+1}};
const stepOf=f=>stepFp((f-.08)/.92);
const rankName=r=>r.tier===8?'Radiante':RANKS[r.tier][0]+' '+r.div;
const bodyW=meas=>{const v=(meas||[]).filter(m=>typeof m.kg==='number'&&m.kg>30);return v.length?v[v.length-1].kg:0};
function RankBadge({r,size}){
 const c=RANKS[r.tier][1],h=size*1.1,rad=r.tier===8;
 return html`<svg width=${size} height=${h} viewBox="0 0 40 44" aria-hidden="true" style=${{flexShrink:0,filter:rad?'drop-shadow(0 0 6px rgba(255,220,120,.7))':'none'}}>
  <path d="M20 2 L36 8 V22 C36 33 28 40 20 43 C12 40 4 33 4 22 V8 Z" fill=${c} fillOpacity=${rad?.35:.2} stroke=${c} strokeWidth="2.2" strokeLinejoin="round"/>
  ${rad?html`<path d="M20 11l2.6 6.4 6.9.5-5.3 4.5 1.7 6.7L20 25.4 14.1 29l1.7-6.7-5.3-4.5 6.9-.5z" fill=${c}/>`
  :Array.from({length:r.div},(_,i)=>html`<path key=${i} d=${'M12 '+(30-i*7)+' L20 '+(23-i*7)+' L28 '+(30-i*7)} fill="none" stroke=${c} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>`)}
 </svg>`;
}
function RanksCard({notes,cfg,meas}){
 const [open,setOpen]=useState(false),bwR=bodyW(meas),bw=bwR||75;
 const mf=muscleF(bestsOf(notes,cfg),bw);
 const ms=Object.entries(mf).map(([g,f])=>({g,r:stepOf(f)})).sort((a,b)=>b.r.fp-a.r.fp);
 const has=ms.length>0,gr=stepFp(has?ms.reduce((t,x)=>t+x.r.fp,0)/ms.length:0);
 const bar=(pct,h,c)=>html`<div style=${{height:h,borderRadius:h/2,background:'#2a2a2a',overflow:'hidden'}}><div className="grow" style=${{height:h,width:pct+'%',borderRadius:h/2,background:c,transition:'width .4s'}}></div></div>`;
 return html`<div className="card p-4">
  <button onClick=${()=>setOpen(o=>!o)} style=${{display:'flex',alignItems:'center',gap:12,width:'100%',textAlign:'left'}} aria-expanded=${open}>
   ${has?html`<${RankBadge} r=${gr} size=${52}/>`:html`<div style=${{width:52,height:57,display:'grid',placeItems:'center',color:'#555',fontSize:22,fontWeight:800}}>?</div>`}
   <div style=${{flex:1,minWidth:0}}>
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:6,gap:8}}><span style=${{fontWeight:700,color:has?RANKS[gr.tier][1]:'#8a8f98'}}>${has?rankName(gr):'Sin clasificar'}</span><span className="text-xs mut">Rango global</span></div>
    ${bar(has?(gr.step>=24?100:Math.round(gr.frac*100)):0,8,has?RANKS[gr.tier][1]:'#555')}
    <div className="text-xs mut" style=${{marginTop:5}}>${has?(gr.step>=24?'Rango máximo':'Siguiente: '+rankName(stepFp((gr.step+1)/25+.0001))):'Termina un entreno con peso para ver tu rango'}</div>
   </div>
   <span className="mut" style=${{flexShrink:0}}>${I(open?P.up:P.down,18)}</span>
  </button>
  ${open&&html`<div style=${{marginTop:14,display:'grid',gap:12}}>
   ${ms.map(({g,r})=>html`<div key=${g} style=${{display:'flex',alignItems:'center',gap:10}}>
    <${RankBadge} r=${r} size=${30}/>
    <div style=${{flex:1,minWidth:0}}>
     <div style=${{display:'flex',justifyContent:'space-between',alignItems:'baseline',fontSize:14,marginBottom:4}}><b>${MUS[g]}</b><span style=${{color:RANKS[r.tier][1],fontWeight:600}}>${rankName(r)}</span></div>
     ${bar(r.step>=24?100:Math.round(r.frac*100),5,RANKS[r.tier][1])}
    </div></div>`)}
   <p className="text-xs mut" style=${{margin:0}}>El rango sale de tu mejor 1RM estimado de cada músculo, comparado con tu peso corporal. Radiante equivale al nivel de un culturista profesional.${bwR?'':' Ahora se calcula con 75 kg: añade tu peso en Medidas para afinarlo.'}</p>
  </div>`}
 </div>`;
}

function RankMap({notes,cfg,meas}){
 const [sel,setSel]=useState(null);
 const bw=bodyW(meas)||75,mf=muscleF(bestsOf(notes,cfg),bw);
 const rk=id=>mf[id]!=null?stepOf(mf[id]):null;
 const fillOf=id=>{const r=rk(id);return r?'url(#rkg'+r.tier+')':'#0d0d0d'};
 const n=Object.keys(mf).length;
 const Fig=(side,dx)=>{const f=BODY[side];return html`<g transform=${'translate('+dx+',0)'}>
  <path d=${f.sil} fill="#0d0d0d" stroke="#fff" strokeWidth="3.2" strokeLinejoin="round"/>
  ${f.mus.map(([g,d],i)=>html`<path key=${side+i} d=${d} fill=${fillOf(g)} stroke=${sel===g?(rk(g)?RANKS[rk(g).tier][1]:'#fff'):'#fff'} strokeWidth=${sel===g?3.4:2.2} strokeLinejoin="round" style=${{cursor:'pointer',transition:'fill .4s, stroke-width .25s',filter:sel===g?'drop-shadow(0 0 6px rgba(255,255,255,.45))':'none',animation:'fade .6s both',animationDelay:(i*25)+'ms'}} onClick=${()=>setSel(sel===g?null:g)}/>`)}
  ${f.lines.map((d,i)=>html`<path key=${'l'+i} d=${d} fill="none" stroke="#fff" strokeWidth="1.6" strokeLinecap="round" opacity=".85" style=${{pointerEvents:'none'}}/>`)}
  <ellipse cx="100" cy="36" rx="17" ry="21" fill="#0d0d0d" stroke="#fff" strokeWidth="3"/>
  <path d=${HAIR[side]} fill="#c9ccd3"/>
 </g>`};
 return html`<div className="card p-4">
  <div className="flex justify-between text-sm mb-2"><span className="mut">Mapa de rangos</span><span className="mut">${n} de ${Object.keys(MUS).length-1} músculos</span></div>
  <svg viewBox="0 0 420 445" style=${{width:'100%',display:'block'}} role="img" aria-label="Mapa de rangos por músculo, de frente y de espaldas">
   <defs>${RANKS.map(([nm,c],i)=>html`<linearGradient key=${i} id=${'rkg'+i} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor=${c} stopOpacity=".55"/><stop offset=".5" stopColor=${c}/><stop offset="1" stopColor=${c} stopOpacity=".8"/></linearGradient>`)}</defs>
   ${Fig('front',0)}${Fig('back',220)}
  </svg>
  <p className="text-sm text-neutral-200" style=${{margin:'6px 0 0',minHeight:20}}>${sel?html`<b>${MUS[sel]}</b> · ${rk(sel)?html`<span style=${{color:RANKS[rk(sel).tier][1],fontWeight:600}}>${rankName(rk(sel))}</span>`:'sin clasificar'}`:'Toca un músculo para ver su rango.'}</p>
  <div style=${{display:'flex',flexWrap:'wrap',gap:'4px 10px',marginTop:8}}>${RANKS.map(([nm,c])=>html`<span key=${nm} className="text-xs mut" style=${{display:'flex',alignItems:'center',gap:4}}><i style=${{width:9,height:9,borderRadius:5,background:c,display:'inline-block'}}></i>${nm}</span>`)}</div>
 </div>`;
}
function WeekChart({notes}){
 const W=[];let w=weekStart(Date.now());for(let i=0;i<8;i++){W.unshift(w);w=weekPrev(w)}

function trend(ms,k){

 }

function useCloud(notes,setNotes){
 const hasClaude=!!(window.claude&&window.claude.use);
 const [st,setSt]=useState('local');
 const [meas,setMeasS]=useState(loadMeas);
 const [cfg,setCfgS]=useState(loadCfg);
 const ref=useRef(null);
 if(!ref.current){let d=[];try{d=JSON.parse(localStorage.getItem('gym-cloud-del')||'[]')}catch(e){}ref.current={coll:null,ready:false,sent:{},del:Array.isArray(d)?d:[],timer:null}}
 const r=ref.current;
 r.notes=notes;r.meas=meas;if(!r.cfg)r.cfg=cfg;
 const ser=n=>JSON.stringify(n);
 const saveIds=()=>{try{localStorage.setItem('gym-cloud-ids',JSON.stringify(Object.keys(r.sent)))}catch(e){}};
 const saveDel=()=>{try{localStorage.setItem('gym-cloud-del',JSON.stringify(r.del))}catch(e){}};
 const setMeas=v=>{r.meas=v;setMeasS(v);try{localStorage.setItem('gym-meas',JSON.stringify(v))}catch(e){}};
 const keepCfg=c=>{r.cfg=c;setCfgS(c);try{localStorage.setItem('gym-cfg',JSON.stringify(c))}catch(e){}};
 const setCfg=p=>{const c={...r.cfg,...p,at:Date.now()};keepCfg(c);if(r.coll&&r.ready)r.coll.doc('cfg').set(clone(c)).catch(()=>{})};
 const flush=async()=>{
  if(!r.coll||!r.ready)return;
  const cur=r.notes,ops=[];
  cur.forEach(n=>{const x=ser(n);if(r.sent[n.id]!==x)ops.push(()=>r.coll.doc('n_'+n.id).set(JSON.parse(x)).then(()=>{r.sent[n.id]=x}))});
  [...r.del].forEach(id=>ops.push(()=>r.coll.doc('n_'+id).delete().then(()=>{r.del=r.del.filter(x=>x!==id);saveDel()})));
  if(!ops.length)return;
  setSt('syncing');
  try{for(const f of ops)await f();saveIds();setSt('ok')}catch(e){setSt('error')}
 };
 const pull=async()=>{
  const snap=await r.coll.limit(500).get(),docs=snap.docs;
  const cloud=docs.map(d=>JSON.parse(JSON.stringify(d.data()))).filter(n=>n&&n.id&&Array.isArray(n.blocks));
  const hasMeta=docs.some(d=>d.id==='meta'),cd=docs.find(d=>d.id==='cfg'),cc=cd?JSON.parse(JSON.stringify(cd.data())):null;
  setMeas(docs.map(d=>d.data()).filter(x=>x&&x.kind==='measure'&&x.t).map(x=>JSON.parse(JSON.stringify(x))).sort((a,b)=>a.t-b.t));
  let known=[],seeds={};try{known=JSON.parse(localStorage.getItem('gym-cloud-ids')||'[]');seeds=JSON.parse(localStorage.getItem('gym-seed-ids')||'{}')}catch(e){}
  seeds={...seeds,...SEEDMAP};
  const cm=new Map(cloud.map(n=>[n.id,n])),fromCloud=new Set();let out=[];
  r.notes.forEach(l=>{const c=cm.get(l.id);
   if(c){if(l.updated>c.updated)out.push(l);else{out.push(c);fromCloud.add(c.id)}cm.delete(l.id)}
   else if(r.sent[l.id]!==undefined||known.includes(l.id))return;
   else if(cloud.length&&seeds[l.id]===l.updated)return;
   else out.push(l)});
  cm.forEach(c=>{if(r.sent[c.id]!==undefined||r.del.includes(c.id))return;out.push(c);fromCloud.add(c.id)});
  out=out.filter(n=>!r.del.includes(n.id));
  out.forEach(n=>{if(fromCloud.has(n.id))r.sent[n.id]=ser(n)});
  Object.keys(r.sent).forEach(id=>{if(!out.some(n=>n.id===id)&&!r.notes.some(n=>n.id===id))delete r.sent[id]});
  if(!r.ready){const junk=out.filter(isEmpty);if(junk.length){junk.forEach(n=>{if(!r.del.includes(n.id))r.del.push(n.id);delete r.sent[n.id]});out=out.filter(n=>!isEmpty(n));saveDel()}}
  /* Ajustes: gana la versión más reciente (nube o este móvil) */
  let c={...CFG0,...r.cfg};if(cc&&(cc.at||0)>=(c.at||0))c={...CFG0,...cc};
  if(!out.length&&!hasMeta){out.push(...seed());c.v=2}
  else if((c.v||0)<2){out=migrate(out);c.v=2}
  if(!c.at)c.at=Date.now();
  if(!hasMeta)r.coll.doc('meta').set({seeded:1}).catch(()=>{});
  r.ready=true;saveIds();setNotes(out);keepCfg(c);setSt('ok');
  if(!cc||ser(cc)!==ser(c))r.coll.doc('cfg').set(clone(c)).catch(()=>{});
 };
 useEffect(()=>{if(!r.ready)return;clearTimeout(r.timer);r.timer=setTimeout(flush,700)},[notes]);
 useEffect(()=>{
  if(!hasClaude){if((r.cfg.v||0)<2)setCfg({v:2});try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}return}
  const go=()=>{if(!r.coll)return;setSt('syncing');pull().catch(()=>setSt('error'))};
  (async()=>{try{const c=window.claude;const db=await c.use('db'),user=await c.use('user');if(!db||!user)return;const id=await user.id();if(!id)return;r.coll=db.collection('data/users/'+id);go()}catch(e){setSt('error')}})();
  const vis=()=>{if(document.visibilityState==='visible')go()};
  document.addEventListener('visibilitychange',vis);window.addEventListener('online',go);
  return()=>{document.removeEventListener('visibilitychange',vis);window.removeEventListener('online',go)};
 },[]);
 const label=hasClaude?{local:'Solo en este dispositivo',syncing:'Sincronizando…',ok:'Guardado en la nube',error:'Sin conexión · guardado en el móvil · toca para reintentar'}[st]:'Guardado en este móvil';
 const sortM=a=>[...a].sort((x,y)=>x.t-y.t);
 return {st,label,meas,cfg,setCfg,mode:hasClaude?'cloud':'local',
  saveMeasure:async e=>{if(r.coll)await r.coll.doc('me_'+e.id).set(clone(e));setMeas(sortM([...r.meas.filter(x=>x.id!==e.id),e]))},
  delMeasure:async e=>{if(r.coll)await r.coll.doc('me_'+e.id).delete();setMeas(r.meas.filter(x=>x.id!==e.id))},
  remove:id=>{if(!r.del.includes(id))r.del.push(id);delete r.sent[id];saveDel()},
  retry:()=>{if(r.coll){setSt('syncing');pull().then(flush).catch(()=>setSt('error'))}},
  /* Importar una copia: reemplaza rutinas, medidas y ajustes */
  replaceAll:async d=>{
   const ids=new Set(d.notes.map(n=>n.id));
   r.del=r.del.filter(id=>!ids.has(id));
   r.notes.forEach(n=>{if(!ids.has(n.id)){if(!r.del.includes(n.id))r.del.push(n.id);delete r.sent[n.id]}});saveDel();
   if(r.coll){for(const m of r.meas)if(!d.meas.some(x=>x.id===m.id))await r.coll.doc('me_'+m.id).delete();for(const m of d.meas)await r.coll.doc('me_'+m.id).set(clone(m))}
   setMeas(sortM(d.meas));setNotes(d.notes.map(clone));setCfg({...CFG0,...d.cfg,v:2});
  }};
}

function ExitAsk({note,onSave,onLeave,onStay}){
 const sets=note.blocks.flatMap(b=>b.type==='exercise'?b.sets:[]),done=sets.filter(s=>s.done).length;
 return html`<${Sheet} title="¿Has terminado?" close=${onStay}>${()=>html`<div className="space-y-3">
  <p className="text-sm mut">Llevas ${done} de ${sets.length} series hechas. Si guardas, el entreno se apunta en el historial, se calcula la progresión y la rutina queda lista para la próxima vez.</p>
  <button onClick=${onSave} className="btn-w h-14 w-full">Guardar y preparar la próxima</button>
  <button onClick=${onLeave} className="h-11 w-full mut">Salir sin guardar</button>
 </div>`}<//>`;
}

   <div className="grid grid-cols-3 gap-3">${Tile(AC.w30,'entrenos · mes')}${Tile(AC.wS,'series · 7 d')}${Tile(fmtK(AC.wV),'kg · 7 d')}</div>
   <div className="card p-4">
    <div className="flex justify-between text-sm mb-3"><span className="mut">Últimos 30 días</span><span className="mut num">${days.filter(d=>act.has(d)).length} días activos</span></div>
    <div className="grid grid-cols-10 gap-1.5">${days.map((d,k)=>html`<button key=${d} aria-label=${new Date(d).toLocaleDateString('es-ES')} onClick=${()=>{setDay(day===d?null:d);if(day!==d){setTab('home');window.scrollTo(0,0)}}} style=${{animationDelay:k*14+'ms'}} className=${'pop-in h-6 rounded-md '+(act.has(d)?'bg-neutral-300':'bg-[#1f1f1f]')+(day===d?' ring-2 ring-white':d===today?' ring-1 ring-white/70':'')}></button>`)}</div>
    ${day&&html`<div className="flex items-center justify-between mt-3 text-sm"><span className="mut">En Inicio: rutinas del ${new Date(day).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</span><button onClick=${()=>setDay(null)} className="text-neutral-300 underline">Quitar filtro</button></div>`}
   </div>
   </div>`}
   ${tab==='meas'&&html`<div className="space-y-3">
   <h1 className="text-2xl font-semibold px-1" style=${{paddingTop:8}}>Medidas</h1>
   <${MeasureCard} ms=${cloud.meas} cloud=${cloud} cloudOk=${true} onNew=${()=>setPh('new')} onHist=${()=>setPh('hist')}/>
   </div>`}
   ${tab==='set'&&html`<div className="space-y-3">
   <h1 className="text-2xl font-semibold px-1" style=${{paddingTop:8}}>Ajustes</h1>
   <${BackupCard} cfg=${cfg} mode=${cloud.mode} msg=${bmsg} onExport=${doExport} onPick=${()=>fileRef.current&&fileRef.current.click()}/>
   <input ref=${fileRef} type="file" accept="application/json,.json" className="hidden" onChange=${pickFile}/>
   <${NotifCard} notes=${notes} cfg=${cfg}/>
   <p className="text-xs mut px-1">${cloud.label}</p>
   </div>`}
  </div>`}
  ${!note&&html`<${TabBar} tab=${tab} setTab=${setTab}/>`}
  ${ask&&note&&html`<${ExitAsk} note=${note} onSave=${()=>{patch(n=>finishNote(n,dl));leaveNow()}} onLeave=${leaveNow} onStay=${()=>setAsk(false)}/>`}
  ${ph==='new'&&html`<${MeasureNew} ms=${cloud.meas} cloud=${cloud} close=${()=>setPh(null)}/>`}
  ${ph==='hist'&&html`<${MeasureHist} ms=${cloud.meas} cloud=${cloud} close=${()=>setPh(null)}/>`}
  ${imp&&html`<${Sheet} title="Importar copia" close=${()=>setImp(null)}>${shut=>html`<div className="space-y-3">
   <p className="text-sm text-neutral-300">Copia ${imp.t?'del '+fecha(imp.t)+' ('+ago(imp.t)+')':'sin fecha'}: ${imp.notes.length} rutinas y ${imp.meas.length} medidas.</p>
   <div className="rounded-2xl bg-neutral-200 text-black px-3 py-2.5 text-sm"><b>Ojo:</b> se reemplazan todos los datos que hay ahora en la app por los de la copia.</div>
   <button onClick=${()=>doImport(imp)} className="btn-w h-14 w-full">Reemplazar mis datos</button>
   <button onClick=${shut} className="h-11 w-full mut">Cancelar</button></div>`}<//>`}
 </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

<script>
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body></html>
