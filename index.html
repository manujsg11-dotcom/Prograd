const {useState,useEffect,useRef}=React;
const html=htm.bind(React.createElement);
const KEY='gym-notes-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const mkSet=(kg='',reps='')=>({id:uid(),kg,reps,done:false});

/* ===== Rutinas A (4 días) y C (3 días) del PDF «Rutina de hipertrofia» ===== */
/* tgt: s = series, lo–hi = rango de reps, inc = kg que se suben, big = básico (descanso 2–3') */
const T=(s,lo,hi,inc,big)=>({s,lo,hi,inc,big});
const ex2=(name,t,kg='')=>({id:uid(),type:'exercise',name,tgt:t,sets:Array.from({length:t.s},()=>mkSet(kg,''))});
const txt=t=>({id:uid(),type:'text',text:t});
const WT="Calentamiento 5': cinta o elíptica + movilidad, y 1–2 series de aproximación en el primer ejercicio. Al final: 15' andar en cinta inclinada.";
const WL="Calentamiento 5': bici o elíptica + movilidad de cadera y tobillo, y 1–2 series de aproximación en el primer ejercicio. Al final: 15' andar en cinta inclinada.";
const CURL="Curl femoral: punta del pie hacia ti para evitar calambres en los gemelos; si siguen, curl femoral de pie en polea con tobillera.";
const ABS="Abdominales: crunch en polea con carga o elevación de piernas colgado.";
const TA=[['Press plano en máquina',T(3,6,10,2.5,1)],['Dominadas lastradas',T(3,5,8,1.25,1)],['Press de hombro en máquina',T(3,8,10,2.5,1)],['Remo con pecho apoyado',T(3,8,10,2.5,1)],['Fondos lastrados',T(3,8,10,1.25,1)],['Elevaciones laterales',T(3,12,15,1,0)],['Curl de bíceps',T(2,10,12,1,0)]];

function kgFrom(old,name,t){
 const keys=ALIAS[norm(name)]||[norm(name)];let best=null;
 old.forEach(n=>{(n.hist||[]).forEach(h=>{if(h.demo)return;(h.ex||[]).forEach(e=>{if(keys.includes(norm(e.n))&&(!best||h.t>best.t))best={t:h.t,s:e.s}})});

 if(!best)return'';
 const ok=best.s.filter(x=>x[1]>=t.lo&&x[0]>0);
 const kg=ok.length?Math.max(...ok.map(x=>x[0])):toInc(Math.max(...best.s.map(x=>x[0]))*0.9,t.inc||1);
 return kg>0?fN(kg):'';

/* cur/prev = [[kg,reps],...] de la última y la penúltima sesión */
function prog(t,cur,prev){
 if(!t||!cur||!cur.length)return null;
 const kg=Math.max(...cur.map(x=>x[0])),reps=cur.map(x=>x[1]).join(' · ');
 if(cur.length>=t.s&&cur.every(x=>x[1]>=t.hi)){const nk=rnd(kg+t.inc);return{k:'up',kg:nk,from:kg,msg:'Sube a '+fN(nk)+' kg',why:'Llegaste a '+t.hi+' reps en todas las series ('+reps+')'}}
 const low=cur.some(x=>x[1]<t.lo);
 if(low&&prev&&prev.length&&prev.some(x=>x[1]<t.lo)&&Math.max(...prev.map(x=>x[0]))===kg){const nk=toInc(kg*0.9,t.inc);return{k:'down',kg:nk,from:kg,msg:'Baja a '+fN(nk)+' kg',why:'Dos sesiones sin llegar a '+t.lo+' reps: baja un 10 % y vuelve a subir'}}
 if(low)return{k:'hold',kg,from:kg,msg:'Mantén '+fN(kg)+' kg',why:'Busca al menos '+t.lo+' reps en todas las series ('+reps+')'};
 return{k:'reps',kg,from:kg,msg:'Mantén '+fN(kg)+' kg y suma reps',why:'Cuando hagas '+t.hi+' en todas, toca subir ('+reps+')'};
}

const lev=(a,b)=>{const d=Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]};
const detect=name=>{
 const n=norm(name),tk=n.split(' ').filter(Boolean);let best=null,bs=0;
 DB.forEach(e=>e[0].split(',').forEach(kw=>{

  if(kw.length<=4)sc=tk.some(t=>t===kw||t===kw+'s')?kw.length+1:0;

};

/* Historial, récords y resumen */
const hasDay=(n,d)=>(n.hist||[]).some(h=>day0(h.t)===d)||n.blocks.some(b=>(b.sets||[]).some(x=>x.done&&day0(x.doneAt||n.updated)===d));
function activity(notes){
 const cut=Date.now()-7*864e5,cut30=Date.now()-30*864e5,days=new Set(),sets={},vol={},st={};let wS=0,wV=0,w30=0;
 notes.forEach(n=>{
  (n.hist||[]).forEach(h=>{if(h.demo)return;days.add(day0(h.t));if(h.t>=cut30)w30++;if(h.t>=cut){wS+=h.sets;wV+=h.vol;Object.entries(h.m||{}).forEach(([g,x])=>{sets[g]=(sets[g]||0)+x.s;vol[g]=(vol[g]||0)+x.v});(h.st||[]).forEach(g=>st[g]=1)}});
  n.blocks.forEach(b=>{if(b.type!=='exercise')return;const m=muscles(b);b.sets.forEach(x=>{if(!x.done)return;const t=x.doneAt||n.updated;days.add(day0(t));if(t<cut)return;const v=N(x.kg)*N(x.reps);wS++;wV+=v;m.ag.forEach(g=>{sets[g]=(sets[g]||0)+1;vol[g]=(vol[g]||0)+v});m.st.forEach(g=>st[g]=1)})})});
 return{days,sets,vol,st,wS,wV,w30};
}
/* Una serie cuenta si tiene reps; el peso puede ser 0 (p. ej. dominadas sin lastre) */
const doneSets=b=>b.sets.filter(s=>s.done&&N(s.reps)>0&&String(s.kg).trim()!=='');
function analyse(note){
 const vol={},ms={},stb=new Set(),ex=[];let nS=0,tot=0;
 note.blocks.filter(b=>b.type==='exercise').forEach(b=>{const d=doneSets(b);if(!d.length)return;const m=muscles(b),gs=m.ag.length?m.ag:['other'];m.st.forEach(g=>stb.add(g));
  ex.push({n:b.name,s:d.map(s=>[N(s.kg),N(s.reps)])});
  d.forEach(s=>{const v=N(s.kg)*N(s.reps);nS++;tot+=v;gs.forEach(g=>{vol[g]=(vol[g]||0)+v;ms[g]=(ms[g]||0)+1})})});
 return{nS,tot,vol,ms,ex,st:[...stb]};
}
/* Plan de la próxima sesión a partir de lo que se acaba de hacer */
const planOf=note=>note.blocks.filter(b=>b.type==='exercise'&&b.tgt).map(b=>{const d=doneSets(b);if(!d.length)return null;const h=histOf(note,b.name);return{id:b.id,name:b.name,p:prog(b.tgt,d.map(s=>[N(s.kg),N(s.reps)]),h[0]&&h[0].s)}}).filter(x=>x&&x.p);
const e1=(kg,r)=>kg*(1+r/30);
const finishNote=(n,dl)=>{
 const a=analyse(n),m={},plan=dl?[]:planOf(n);Object.keys(a.vol).forEach(g=>m[g]={s:a.ms[g],v:Math.round(a.vol[g])});
 const best={...(n.best||{})};a.ex.forEach(e=>{const k=norm(e.n);if(!k)return;const b=Math.max(...e.s.map(x=>e1(x[0],x[1])));if(b>0)best[k]=Math.max(best[k]||0,Math.round(b*10)/10)});
 const hist=a.nS?[...(n.hist||[]),{t:Date.now(),sets:a.nS,vol:Math.round(a.tot),ex:a.ex,m,st:a.st,...(dl?{dl:1}:{})}].slice(-60):(n.hist||[]);
 const out=clear({...clone(n),hist,best});
 out.blocks=out.blocks.map(b=>{const pl=plan.find(x=>x.id===b.id);if(!pl)return b;return{...b,sets:fitSets(b,pl.p.kg)}});
 return out;
};
/* Gesto de iPhone en ventanas: deslizar desde el borde izquierdo para volver */
function useSwipeBack(onBack){
 const s=useRef(null),el=useRef(null);
 const stop=e=>{if(e&&e.stopPropagation)e.stopPropagation()};
 const start=e=>{stop(e);const t=e.touches[0];s.current=(e.touches.length===1&&t.clientX<=28)?{x:t.clientX,y:t.clientY,t:Date.now(),dx:0,on:false}:null};
 const move=e=>{stop(e);const c=s.current,n=el.current;if(!c||!n)return;const t=e.touches[0],dx=t.clientX-c.x,dy=t.clientY-c.y;
  if(!c.on){if(Math.abs(dy)>10&&Math.abs(dy)>dx){s.current=null;return}if(dx<8)return;c.on=true}
  c.dx=Math.max(0,dx);n.style.transition='none';n.style.transform='translateX('+c.dx+'px)'};
 const end=e=>{stop(e);const c=s.current,n=el.current;s.current=null;if(!c||!c.on||!n)return;const w=window.innerWidth,v=c.dx/Math.max(1,Date.now()-c.t);
  n.style.transition='transform .28s cubic-bezier(.32,.72,0,1)';
  if(c.dx>w*0.33||(v>0.5&&c.dx>40)){n.style.transform='translateX('+w+'px)';setTimeout(onBack,240)}
  else{n.style.transform='';setTimeout(()=>{if(el.current)el.current.style.transition=''},300)}};
 return{ref:el,on:{onTouchStart:start,onTouchMove:move,onTouchEnd:end,onTouchCancel:end}};
}
function Summary({note,all,close,onSave,dl}){

 const rows=Object.entries(a.vol).sort((x,y)=>y[1]-x[1]),mx=rows.length?rows[0][1]:1;

    ${dl&&html`<div className="field px-3 py-2.5 text-sm text-neutral-300">Semana de descarga: este entreno se apunta en el historial, pero no cuenta para la progresión ni cambia tus pesos.</div>`}

     <span className=${'h-8 w-8 shrink-0 rounded-full grid place-items-center '+(x.p.k==='up'?'bg-neutral-200 text-black':'bg-[#2a2a2a] text-neutral-300')}>${I(ic[x.p.k],15)}</span>
     <div className="min-w-0"><div className="font-medium truncate">${x.name}</div><div className="text-sm mut num">${x.p.msg}</div></div></div>`)}</div></div>`}
    ${prs.length>0&&html`<div><h3 className="font-semibold mb-2">Récords personales</h3><div className="space-y-2">${prs.map((p,k)=>html`<div key=${k} className="chip rounded-2xl p-3 flex items-center justify-between pop-in" style=${{animationDelay:k*80+'ms'}}><div><div className="font-medium">${p.name}</div><div className="text-sm mut num">1RM est. ${fN(p.best.toFixed(1))} kg${p.prev?' · +'+fN(((p.best/p.prev-1)*100).toFixed(1))+'%':' · primer registro'}</div></div><span className="btn-w text-xs px-3 py-1">PR</span></div>`)}</div></div>`}

    <div className="space-y-2 pt-1"><button onClick=${()=>shut(onSave)} className="btn-w h-14 w-full">${dl?'Guardar entreno':'Guardar y preparar la próxima'}</button><button onClick=${()=>shut()} className="h-11 w-full mut">Cerrar sin guardar</button></div>

  </div></div>`,document.body);

 const dl=cfg.deload,[cd,setCd]=useState(false),ready=[];let first=0;
 notes.forEach(n=>{(n.hist||[]).forEach(h=>{if(!h.demo&&(!first||h.t<first))first=h.t});if(dl)return;
  n.blocks.forEach(b=>{if(b.type!=='exercise'||!b.tgt)return;const h=histOf(n,b.name);if(!h.length)return;const p=prog(b.tgt,h[0].s,h[1]&&h[1].s);if(p&&p.k==='up'&&!isApplied(b,p))ready.push({id:n.id,day:n.title,name:b.name,p})})});
 const start=cfg.lastDeload||first,wk=start?Math.floor((Date.now()-start)/(7*864e5))+1:0,due=wk>=5,dd=dl?daysSince(dl)+1:0;
 const ask=f=>{if(cd){setCd(false);f()}else{setCd(true);setTimeout(()=>setCd(false),3000)}};

  <div className="flex items-baseline gap-2"><span className="text-4xl font-bold num">${ready.length}</span><span className="text-sm mut">${ready.length===1?'ejercicio listo para subir':'ejercicios listos para subir'}</span></div>

  <div className="mt-4 pt-3 border-t border-white/5">

  :html`<div>

/* ===== Medidas corporales + recomendaciones ===== */
/* [clave, nombre, unidad, cómo medir, recomendada] */
const MEAS=[
 ['kg','Peso','kg','En ayunas, después de ir al baño y siempre con la misma báscula.',1],
 ['waist','Cintura','cm','A la altura del ombligo, de pie, relajado y después de soltar el aire. Sin meter tripa.',1],
 ['arm','Brazo','cm','Brazo contraído, por la parte más ancha. Siempre el mismo brazo.',0],
 ['chest','Pecho','cm','A la altura de los pezones, con los brazos relajados y sin hinchar el pecho.',0],
 ['shoulders','Hombros','cm','Rodeando los dos hombros por la parte más ancha, con los brazos relajados.',0],
 ['thigh','Muslo','cm','De pie y relajado, por la parte más ancha. Siempre la misma pierna.',0]];
const mName=k=>(MEAS.find(m=>m[0]===k)||[k,k])[1];
const mUnit=k=>(MEAS.find(m=>m[0]===k)||[k,k,''])[2];
const ME_EVERY=14,ME_MIN=10;
const daysSince=t=>Math.floor((day0(Date.now())-day0(t))/864e5);
const fecha=t=>new Date(t).toLocaleDateString('es-ES',{day:'numeric',month:'long'});
const sgn=x=>(x>0?'+':x<0?'−':'')+fN(Math.abs(Math.round(x*10)/10));
/* Tendencia de una medida: la última frente a una de hace 10–42 días (o la más reciente de al menos 10 días antes) */
function trend(ms,k){
 const v=ms.filter(m=>typeof m[k]==='number');if(v.length<2)return null;
 const last=v[v.length-1],old=v.filter(m=>m.t<=last.t-ME_MIN*864e5);if(!old.length)return null;
 const inWin=old.filter(m=>m.t>=last.t-42*864e5),base=inWin.length?inWin[0]:old[old.length-1];
 const days=Math.max(1,(last.t-base.t)/864e5),d=last[k]-base[k];
 return{d,days:Math.round(days),pm:d/days*30,from:base,to:last};
}
/* Recomendación según peso y cintura (objetivo: ganar músculo con poca grasa) */
function advice(ms){
 if(!ms.length)return{lv:'info',title:'Haz tu primera medición',text:'Con peso y cintura cada 2 semanas la app te dirá si comes lo justo para ganar músculo sin coger grasa de más.',tips:[]};
 const w=trend(ms,'kg'),c=trend(ms,'waist'),tips=[];
 if(!w){const l=ms[ms.length-1],left=Math.max(0,ME_MIN-daysSince(l.t));return{lv:'info',title:'Punto de partida guardado',text:'Para ver una tendencia hacen falta dos mediciones separadas al menos '+ME_MIN+' días.'+(left?' Vuelve a medirte dentro de '+left+' días como pronto.':' Ya puedes volver a medirte.'),tips:typeof l.waist==='number'?[]:['Apunta también la cintura: es el mejor dato para saber si subes grasa.']}}
 const r=w.pm,cr=c?c.pm:null,R=fN(Math.round(Math.abs(r)*10)/10),CR=c?fN(Math.round(Math.abs(cr)*10)/10):'';
 let a;
 if(r>1){
  a=cr!=null&&cr>1?{lv:'warn',d:-1,title:'Estás cogiendo grasa de más',text:'Subes '+R+' kg al mes y la cintura '+CR+' cm al mes. Es más rápido de lo que se puede ganar músculo.',tips:['Baja el batido un paso: unas 100 kcal menos al día.']}
   :{lv:'warn',d:-1,title:'Subes de peso demasiado rápido',text:'Subes '+R+' kg al mes y lo razonable son 0,5–1 kg. Si sigue así, una parte será grasa.',tips:['Baja el batido un paso: unas 100 kcal menos al día.']};
  if(cr==null)a.tips.push('Apunta la cintura para saber si lo que sube es grasa.');
 }else if(r>=0.2){
  a=cr!=null&&cr>1?{lv:'warn',d:-1,title:'Algo de grasa de más',text:'El peso sube a buen ritmo ('+R+' kg al mes), pero la cintura crece '+CR+' cm al mes.',tips:['Baja el batido un paso y mira la cintura en la próxima medición.']}
   :{lv:'ok',title:'Vas bien',text:'Subes '+R+' kg al mes'+(cr==null?'':cr<=0.3?' y la cintura casi no cambia':' y la cintura sube poco')+'. Es buen ritmo para ganar músculo con poca grasa.',tips:['Sigue comiendo igual y mantén el batido.']};
 }else if(r>-0.2){
  a=cr!=null&&cr<-0.3?{lv:'ok',title:'Estás en recomposición',text:'El peso apenas cambia y la cintura baja '+CR+' cm al mes: pierdes grasa y probablemente ganas músculo.',tips:['Mantén el batido. Si quieres crecer más rápido, súbelo un paso.']}
   :{lv:'info',d:1,title:'Tu peso está estancado',text:'En '+w.days+' días el peso casi no ha cambiado. Para ganar músculo a buen ritmo necesitas comer un poco más.',tips:['Sube el batido un paso: unas 100–130 kcal más al día.','Si aun así sigues subiendo pesos en el gimnasio, estás progresando.']};
 }else{
  a={lv:'warn',d:2,title:'Estás perdiendo peso',text:'Bajas '+R+' kg al mes. Así cuesta mucho ganar músculo.',tips:['Sube el batido dos pasos: unas 200 kcal más al día, sobre todo hidratos.']};
 }
 [['arm','El brazo'],['shoulders','Los hombros'],['chest','El pecho']].forEach(([k,l])=>{const t=trend(ms,k);if(t&&t.d>=0.3)a.tips.push(l+' ha'+(k==='shoulders'?'n':'')+' crecido '+fN(Math.round(t.d*10)/10)+' cm desde el '+fecha(t.from.t)+'.')});
 a.basis='Comparando con el '+fecha(w.from.t)+' ('+w.days+' días)';
 return a;
}

function Spark({ms,k}){
 const v=ms.filter(m=>typeof m[k]==='number');if(v.length<2)return null;

   setMeas(sortM(d.meas));setNotes(d.notes.map(clone));setCfg({...CFG0,...d.cfg,v:2});
  }};

 /* Copia de seguridad */
 const doExport=async()=>{setBmsg(null);const r=await exportData({app:'pesos-gym',v:2,t:Date.now(),notes,meas:cloud.meas,cfg:{...cfg}});if(r==='ok'){cloud.setCfg({lastExport:Date.now()});setBmsg('Copia exportada. Guárdala en Archivos o en iCloud.')}else setBmsg(r==='declined'?'No se ha guardado la copia.':'No se ha podido exportar. Prueba otra vez.')};
 const pickFile=e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||d.app!=='pesos-gym'||!Array.isArray(d.notes))throw 0;setImp({notes:d.notes.filter(n=>n&&n.id&&Array.isArray(n.blocks)),meas:Array.isArray(d.meas)?d.meas.filter(m=>m&&m.id&&m.t):[],cfg:d.cfg&&typeof d.cfg==='object'?d.cfg:{},t:d.t||0})}catch(x){setBmsg('Ese archivo no es una copia de Prograd.')}};rd.onerror=()=>setBmsg('No se ha podido leer el archivo.');rd.readAsText(f)};
 const doImport=async d=>{setImp(null);try{await cloud.replaceAll(d);setAid(null);setBmsg('Copia importada: '+d.notes.length+' rutinas y '+d.meas.length+' medidas.')}catch(e){setBmsg('No se ha podido importar del todo. Prueba otra vez.')}};
 const allTags=[...new Set(notes.flatMap(n=>n.tags))].sort((a,b)=>(a.startsWith('Rutina ')?0:1)-(b.startsWith('Rutina ')?0:1)||a.localeCompare(b));
 const ft=tag&&allTags.includes(tag)?tag:null;
 const sorted=[...notes].sort((a,b)=>a.plan&&b.plan?(a.plan===b.plan?a.day-b.day:a.plan<b.plan?-1:1):a.plan?-1:b.plan?1:b.updated-a.updated);
 const shown=sorted.filter(n=>(!ft||n.tags.includes(ft))&&(!day||hasDay(n,day))&&(!q||((n.title||'')+' '+n.tags.join(' ')).toLowerCase().includes(q.toLowerCase())));
 const info=n=>{const e=n.blocks.filter(b=>b.type==='exercise').length,s=n.blocks.flatMap(b=>b.sets||[]);return e?`${e} ejercicios · ${s.length} series`:`${n.blocks.length} bloques`};
 const histTxt=n=>{const h=(n.hist||[]).filter(x=>!x.demo);return h.length?`Hecha ${h.length} ${h.length===1?'vez':'veces'} · última ${ago(h[h.length-1].t)}`:null};
 const inProg=n=>{const s=n.blocks.flatMap(b=>b.sets||[]),d=s.filter(x=>x.done).length;return d?`${d}/${s.length}`:null};
 const today=day0(Date.now());
 const days=Array.from({length:30},(_,k)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(29-k));return d.getTime()});
 const AC=activity(notes),act=AC.days;
 const Tile=(v,l)=>html`<div className="card p-4 text-center pop-in"><div className="text-2xl font-semibold num">${v}</div><div className="text-sm mut">${l}</div></div>`;
 /* El gesto se escucha en toda la pantalla, también en el margen del borde */
 return html`<div className="mx-auto max-w-xl px-4 pt-6 pb-24 min-h-screen" onTouchStart=${note?tStart:null} onTouchMove=${note?tMove:null} onTouchEnd=${note?tEnd:null} onTouchCancel=${note?tEnd:null}>
  ${note?html`<div key="editor" ref=${wrap} className="bg-black min-h-screen"><${Editor} key=${note.id} note=${note} all=${notes} dl=${dl} patch=${patch} onBack=${leave} onDup=${dup} onDel=${()=>{drop(aid);setAid(null);window.scrollTo(0,0)}}/></div>`:
  html`<div key="home" className="space-y-3 push-in">
   <div className="flex items-end justify-between gap-3 px-1 pb-1">
    <div className="min-w-0"><h1 className="pt-1"><${Logo}/></h1>
     <button onClick=${cloud.retry} className="mt-2 flex items-center gap-1.5 text-xs mut text-left"><span className=${'inline-block h-1.5 w-1.5 shrink-0 rounded-full '+(cloud.st==='ok'||cloud.mode==='local'?'bg-neutral-200':cloud.st==='syncing'?'bg-neutral-400 blink':'bg-neutral-600')}></span>${cloud.label}</button></div>
    <button onClick=${create} className="btn-w h-11 px-4 shrink-0 flex items-center gap-1.5 text-sm">${I(P.plus,16)}Nueva</button>
   </div>
   ${dl&&html`<div className="rounded-2xl bg-neutral-200 text-black px-4 py-3 text-sm pop-in"><b>Semana de descarga</b> · día ${Math.min(7,daysSince(cfg.deload)+1)} de 7. Mitad de series, −10 % de peso y RPE 6–7.</div>`}
   <${NextCard} notes=${notes} cfg=${cfg} setPlan=${k=>cloud.setCfg({plan:k})} open=${open}/>
   <h2 className="text-xl font-semibold px-1 pt-3">Tus rutinas</h2>
   <p className="text-xs mut px-1 -mt-1">Rutina A (4 días) y Rutina C (3 días, para épocas de muchos exámenes), del PDF «Rutina de hipertrofia». Tus rutinas de antes están en «Antiguas», con su historial.</p>
   <input value=${q} onChange=${e=>setQ(e.target.value)} placeholder="Buscar rutina o etiqueta" className="field w-full h-12 px-4"/>
   ${allTags.length>0&&html`<div className="flex gap-2 flex-wrap">
    ${allTags.map(t=>html`<button key=${t} onClick=${()=>setTag(ft===t?null:t)} className=${'h-9 px-4 rounded-full text-sm '+(ft===t?'bg-neutral-200 text-black font-semibold':'chip mut')}>${t}</button>`)}
    <button onClick=${()=>setTag(null)} className=${'h-9 px-4 rounded-full text-sm '+(!ft?'bg-neutral-200 text-black font-semibold':'chip mut')}>Todas</button>
   </div>`}
   <div className="space-y-3">
    ${shown.map((n,ix)=>html`<button key=${n.id} style=${{animationDelay:ix*50+'ms'}} onClick=${()=>open(n.id)} className="pop-in card w-full text-left p-4 flex items-center gap-3">
     <div className="flex-1 min-w-0">
      <div className="flex items-center gap-2"><span className="text-lg font-semibold truncate">${n.title||'Sin título'}</span>${inProg(n)&&html`<span className="shrink-0 rounded-full bg-neutral-200 text-black text-xs font-semibold px-2 py-0.5 num">En curso ${inProg(n)}</span>`}</div>
      <div className="text-sm mut">${info(n)}</div>
      ${histTxt(n)&&html`<div className="text-sm text-neutral-300">${histTxt(n)}</div>`}
      ${n.tags.length>0&&html`<div className="flex gap-1.5 mt-2 flex-wrap">${n.tags.map(t=>html`<span key=${t} className="chip rounded-full px-2.5 py-0.5 text-xs mut">${t}</span>`)}</div>`}</div>
     <span className="mut">${I(P.chev,18)}</span></button>`)}
    ${shown.length===0&&html`<p className="mut text-center py-8">${notes.length?'No hay rutinas con este filtro.':'Cargando tus rutinas…'}</p>`}
   </div>
   <div className="pt-3"></div>
   <${ProgCard} notes=${notes} open=${open} cfg=${cfg} onStartDl=${beginDl} onEndDl=${finishDl}/>
   <${MeasureCard} ms=${cloud.meas} cloud=${cloud} cloudOk=${true} onNew=${()=>setPh('new')} onHist=${()=>setPh('hist')}/>
   <div className="grid grid-cols-3 gap-3">${Tile(AC.w30,'entrenos · 30 d')}${Tile(AC.wS,'series · 7 d')}${Tile(fmtK(AC.wV),'kg · 7 d')}</div>
   <div className="card p-4">
    <div className="flex justify-between text-sm mb-3"><span className="mut">Últimos 30 días</span><span className="mut num">${days.filter(d=>act.has(d)).length} días activos</span></div>
    <div className="grid grid-cols-10 gap-1.5">${days.map((d,k)=>html`<button key=${d} aria-label=${new Date(d).toLocaleDateString('es-ES')} onClick=${()=>{setDay(day===d?null:d);if(day!==d)window.scrollTo({top:0,behavior:'smooth'})}} style=${{animationDelay:k*14+'ms'}} className=${'pop-in h-6 rounded-md '+(act.has(d)?'bg-neutral-300':'bg-[#1f1f1f]')+(day===d?' ring-2 ring-white':d===today?' ring-1 ring-white/70':'')}></button>`)}</div>
    ${day&&html`<div className="flex items-center justify-between mt-3 text-sm"><span className="mut">Arriba: rutinas del ${new Date(day).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</span><button onClick=${()=>setDay(null)} className="text-neutral-300 underline">Quitar filtro</button></div>`}
   </div>
   <${BackupCard} cfg=${cfg} mode=${cloud.mode} msg=${bmsg} onExport=${doExport} onPick=${()=>fileRef.current&&fileRef.current.click()}/>
   <input ref=${fileRef} type="file" accept="application/json,.json" className="hidden" onChange=${pickFile}/>
  </div>`}
  ${ask&&note&&html`<${ExitAsk} note=${note} onSave=${()=>{patch(n=>finishNote(n,dl));leaveNow()}} onLeave=${leaveNow} onStay=${()=>setAsk(false)}/>`}
  ${ph==='new'&&html`<${MeasureNew} ms=${cloud.meas} cloud=${cloud} close=${()=>setPh(null)}/>`}
  ${ph==='hist'&&html`<${MeasureHist} ms=${cloud.meas} cloud=${cloud} close=${()=>setPh(null)}/>`}
  ${imp&&html`<${Sheet} title="Importar copia" close=${()=>setImp(null)}>${shut=>html`<div className="space-y-3">
   <p className="text-sm text-neutral-300">Copia ${imp.t?'del '+fecha(imp.t)+' ('+ago(imp.t)+')':'sin fecha'}: ${imp.notes.length} rutinas y ${imp.meas.length} medidas.</p>
   <div className="rounded-2xl bg-neutral-200 text-black px-3 py-2.5 text-sm"><b>Ojo:</b> se reemplazan todos los datos que hay ahora en la app por los de la copia.</div>
   <button onClick=${()=>doImport(imp)} className="btn-w h-14 w-full">Reemplazar mis datos</button>
   <button onClick=${shut} className="h-11 w-full mut">Cancelar</button></div>`}<//>`}
 </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

<script>
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body></html>
