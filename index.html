/* Superficies con jerarquía en vez de cajas iguales */

<script>
const {useState,useEffect,useRef}=React;
const html=htm.bind(React.createElement);
const KEY='gym-notes-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const mkSet=(kg='',reps='')=>({id:uid(),kg,reps,done:false});

/* ===== Rutinas A (4 días) y C (3 días) del PDF «Rutina de hipertrofia» ===== */
/* tgt: s = series, lo–hi = rango de reps, inc = kg que se suben, big = básico (descanso 2–3') */
const T=(s,lo,hi,inc,big)=>({s,lo,hi,inc,big});
const ex2=(name,t,kg='')=>({id:uid(),type:'exercise',name,tgt:t,sets:Array.from({length:t.s},()=>mkSet(kg,''))});
const txt=t=>({id:uid(),type:'text',text:t});
const WT="Calentamiento 5': cinta o elíptica + movilidad, y 1–2 series de aproximación en el primer ejercicio. Al final: 15' andar en cinta inclinada.";
const WL="Calentamiento 5': bici o elíptica + movilidad de cadera y tobillo, y 1–2 series de aproximación en el primer ejercicio. Al final: 15' andar en cinta inclinada.";
const CURL="Curl femoral: punta del pie hacia ti para evitar calambres en los gemelos; si siguen, curl femoral de pie en polea con tobillera.";
const ABS="Abdominales: crunch en polea con carga o elevación de piernas colgado.";
const TA=[['Press plano en máquina',T(3,6,10,2.5,1)],['Dominadas lastradas',T(3,5,8,1.25,1)],['Press de hombro en máquina',T(3,8,10,2.5,1)],['Remo con pecho apoyado',T(3,8,10,2.5,1)],['Fondos lastrados',T(3,8,10,1.25,1)],['Elevaciones laterales',T(3,12,15,1,0)],['Curl de bíceps',T(2,10,12,1,0)]];
const TB=[['Press inclinado con mancuernas',T(3,8,10,2,1)],['Dominadas lastradas neutras',T(3,6,10,1.25,1)],['Remo en polea baja',T(3,10,12,2.5,1)],['Elevaciones laterales',T(3,15,20,1,0)],['Pec deck invertido',T(3,12,15,2.5,0)],['Extensión de tríceps en polea',T(3,10,12,2.5,0)],['Curl inclinado o martillo',T(3,10,12,1,0)],['Abdominales',T(3,10,15,2.5,0)]];
const LA=[['Búlgaras',T(3,8,10,2,1)],['Prensa',T(3,8,10,5,1)],['Curl femoral tumbado',T(3,10,12,2.5,0)],['Extensión de cuádriceps',T(2,10,12,2.5,0)],['Gemelos',T(3,12,15,5,0)]];
const LB=[['Prensa con pies altos',T(3,10,12,5,1)],['Curl femoral tumbado',T(3,10,12,2.5,0)],['Gemelos',T(3,12,15,5,0)],['Abdominales',T(3,10,15,2.5,0)]];
const LC=[['Búlgaras',T(3,8,10,2,1)],['Prensa',T(3,8,10,5,1)],['Curl femoral tumbado',T(4,10,12,2.5,0)],['Extensión de cuádriceps',T(2,10,12,2.5,0)],['Gemelos',T(3,12,15,5,0)],['Abdominales',T(3,10,15,2.5,0)]];
const PLANS={
 A:{name:'Rutina A',sub:'4 días',days:[['Día 1 — Torso A',WT,TA],['Día 2 — Pierna A',WL+' '+CURL,LA],['Día 3 — Torso B',WT+' '+ABS,TB],['Día 4 — Pierna B',WL+' '+ABS,LB]]},
 C:{name:'Rutina C',sub:'3 días',days:[['Día 1 — Torso A',WT,TA],['Día 2 — Pierna',WL+' '+CURL+' '+ABS,LC],['Día 3 — Torso B',WT+' '+ABS,TB]]}};
const planNotes=(kgOf=()=>'')=>{const now=Date.now(),out=[];['A','C'].forEach((p,pi)=>PLANS[p].days.forEach(([title,note,exs],i)=>out.push({id:uid(),title,tags:[PLANS[p].name],plan:p,day:i+1,updated:now-(pi*10+i)*1000,blocks:[txt(note),...exs.map(([n,t])=>ex2(n,{...t},kgOf(n,t)))]})));return out};
const seed=()=>planNotes();
/* Paso a A y C conservando las rutinas antiguas (con su historial) y empezando con tus últimos pesos */
const ALIAS={'press plano en maquina':['press banca','press plano','press banca maquina','press plano maquina'],'dominadas lastradas':['dominadas lastradas','dominadas'],'dominadas lastradas neutras':['dominadas lastradas neutras','dominadas lastradas','dominadas'],'press de hombro en maquina':['maquina press militar','press militar maquina','press hombro maquina','press de hombro'],'fondos lastrados':['fondos lastrados','fondos'],'press inclinado con mancuernas':['press inclinado mancuernas','press inclinado'],'elevaciones laterales':['elevaciones laterales','laterales en polea','laterales'],'bulgaras':['bulgaras mancuernas','bulgaras','sentadilla bulgara'],'prensa':['prensa'],'curl femoral tumbado':['curl femoral tumbado','femoral','curl femoral'],'extension de cuadriceps':['extension de cuadriceps','quadriceps','cuadriceps'],'gemelos':['gemelos']};
function kgFrom(old,name,t){
 const keys=ALIAS[norm(name)]||[norm(name)];let best=null;
 old.forEach(n=>{(n.hist||[]).forEach(h=>{if(h.demo)return;(h.ex||[]).forEach(e=>{if(keys.includes(norm(e.n))&&(!best||h.t>best.t))best={t:h.t,s:e.s}})});
  n.blocks.forEach(b=>{if(b.type!=='exercise'||!keys.includes(norm(b.name)))return;const d=b.sets.filter(x=>x.done&&N(x.kg)>0&&N(x.reps)>0);if(!d.length)return;const tt=Math.max(...d.map(x=>x.doneAt||n.updated));if(!best||tt>best.t)best={t:tt,s:d.map(x=>[N(x.kg),N(x.reps)])}})});
 if(!best)return'';
 const ok=best.s.filter(x=>x[1]>=t.lo&&x[0]>0);
 const kg=ok.length?Math.max(...ok.map(x=>x[0])):toInc(Math.max(...best.s.map(x=>x[0]))*0.9,t.inc||1);
 return kg>0?fN(kg):'';
}
function migrate(notes){
 const old=notes.filter(n=>!n.plan);
 const fresh=planNotes((name,t)=>kgFrom(old,name,t));
 return[...fresh,...old.map(n=>({...n,tags:[...new Set([...(n.tags||[]).filter(t=>t!=='Rutina'),'Antiguas'])],updated:(n.updated||0)+1}))];
}
/* Semana de descarga: mitad de series y −10 % de peso; los pesos de antes se guardan para volver a ellos */
const dlSets=t=>Math.max(1,Math.round(t.s/2));
const startDl=n=>{let ch=false;const blocks=n.blocks.map(b=>{if(b.type!=='exercise'||!b.tgt||b.dl)return b;ch=true;const kg=Math.max(0,...b.sets.map(x=>N(x.kg))),nk=kg>0?fN(toInc(kg*0.9,b.tgt.inc||1)):'';return{...b,dl:{sets:b.sets.map(x=>({...x,done:false,doneAt:null}))},sets:Array.from({length:dlSets(b.tgt)},()=>mkSet(nk,''))}});return ch?{...n,blocks,updated:Date.now()}:n};

/* ===== Sistema de progresión (doble progresión) ===== */
const rnd=x=>Math.round(x*100)/100;

/* cur/prev = [[kg,reps],...] de la última y la penúltima sesión */
function prog(t,cur,prev){
 if(!t||!cur||!cur.length)return null;
 const kg=Math.max(...cur.map(x=>x[0])),reps=cur.map(x=>x[1]).join(' · ');
 if(cur.length>=t.s&&cur.every(x=>x[1]>=t.hi)){const nk=rnd(kg+t.inc);return{k:'up',kg:nk,from:kg,msg:'Sube a '+fN(nk)+' kg',why:'Llegaste a '+t.hi+' reps en todas las series ('+reps+')'}}
 const low=cur.some(x=>x[1]<t.lo);
 if(low&&prev&&prev.length&&prev.some(x=>x[1]<t.lo)&&Math.max(...prev.map(x=>x[0]))===kg){const nk=toInc(kg*0.9,t.inc);return{k:'down',kg:nk,from:kg,msg:'Baja a '+fN(nk)+' kg',why:'Dos sesiones sin llegar a '+t.lo+' reps: baja un 10 % y vuelve a subir'}}
 if(low)return{k:'hold',kg,from:kg,msg:'Mantén '+fN(kg)+' kg',why:'Busca al menos '+t.lo+' reps en todas las series ('+reps+')'};
 return{k:'reps',kg,from:kg,msg:'Mantén '+fN(kg)+' kg y suma reps',why:'Cuando hagas '+t.hi+' en todas, toca subir ('+reps+')'};
}

const lev=(a,b)=>{const d=Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]};
const detect=name=>{
 const n=norm(name),tk=n.split(' ').filter(Boolean);let best=null,bs=0;
 DB.forEach(e=>e[0].split(',').forEach(kw=>{
  const m=kw.split(' ').length;let sc=0;
  if(kw.length<=4)sc=tk.some(t=>t===kw||t===kw+'s')?kw.length+1:0;
  else if(n.includes(kw))sc=kw.length+1;
  else{const tol=kw.length>=9?2:kw.length>=5?1:0;for(let i=0;i+m<=tk.length;i++)if(lev(tk.slice(i,i+m).join(' '),kw)<=tol){sc=kw.length;break}}
  if(sc>bs){bs=sc;best=e}}));
 return best?{ag:best[1],st:best[2]}:{ag:[],st:[]};
};

const calcPlates=(kg,bar)=>{let r=(kg-bar)/2;const out=[],side=r;if(r<0)return{out,left:0,side};for(const[p]of PL){const c=Math.floor(r/p+1e-9);if(c){out.push([p,c]);r-=c*p}}return{out,left:Math.round(r*100)/100,side}};

function useSwipeBack(onBack){

 const start=e=>{stop(e);const t=e.touches[0];s.current=(e.touches.length===1&&t.clientX<=28)?{x:t.clientX,y:t.clientY,t:Date.now(),dx:0,on:false}:null};
 const move=e=>{stop(e);const c=s.current,n=el.current;if(!c||!n)return;const t=e.touches[0],dx=t.clientX-c.x,dy=t.clientY-c.y;
  if(!c.on){if(Math.abs(dy)>10&&Math.abs(dy)>dx){s.current=null;return}if(dx<8)return;c.on=true}
  c.dx=Math.max(0,dx);n.style.transition='none';n.style.transform='translateX('+c.dx+'px)'};
 const end=e=>{stop(e);const c=s.current,n=el.current;s.current=null;if(!c||!c.on||!n)return;const w=window.innerWidth,v=c.dx/Math.max(1,Date.now()-c.t);
  n.style.transition='transform .28s cubic-bezier(.32,.72,0,1)';
  if(c.dx>w*0.33||(v>0.5&&c.dx>40)){n.style.transform='translateX('+w+'px)';setTimeout(onBack,240)}
  else{n.style.transform='';setTimeout(()=>{if(el.current)el.current.style.transition=''},300)}};
 return{ref:el,on:{onTouchStart:start,onTouchMove:move,onTouchEnd:end,onTouchCancel:end}};
}

function ProgCard({notes,open,cfg,onStartDl,onEndDl}){
 const dl=cfg.deload,[cd,setCd]=useState(false),ready=[];let first=0;
 notes.forEach(n=>{(n.hist||[]).forEach(h=>{if(!h.demo&&(!first||h.t<first))first=h.t});if(dl)return;
  n.blocks.forEach(b=>{if(b.type!=='exercise'||!b.tgt)return;const h=histOf(n,b.name);if(!h.length)return;const p=prog(b.tgt,h[0].s,h[1]&&h[1].s);if(p&&p.k==='up'&&!isApplied(b,p))ready.push({id:n.id,day:n.title,name:b.name,p})})});
 const start=cfg.lastDeload||first,wk=start?Math.floor((Date.now()-start)/(7*864e5))+1:0,due=wk>=5,dd=dl?daysSince(dl)+1:0;

  <div className="mt-4 pt-3 border-t border-white/5">

  :html`<div>

/* ===== Qué día toca (rutinas ancladas arriba) ===== */
const pinTags=(notes,cfg)=>{const have=new Set(notes.flatMap(n=>n.tags||[]));return(Array.isArray(cfg.pins)?cfg.pins:['Rutina A','Rutina C']).filter(t=>have.has(t))};
/* ===== Rangos por músculo (según el peso que levantas) ===== */
const RANKS=[['Hierro','#8b9099'],['Bronce','#c27c48'],['Plata','#cfd6de'],['Oro','#f0b92b'],['Platino','#35c7c1'],['Diamante','#a67cf5'],['Ascendente','#3fc07c'],['Inmortal','#ee4b55'],['Radiante','#ffe9a3']];
const REFS=[[/triceps|frances|skull|pushdown/,1],[/gemelo|calf|talon/,3],[/femoral|leg curl/,1.3],[/martillo|hammer/,.55],[/curl|biceps/,.9],[/press militar|overhead|press de hombro|press hombro|shoulder press/,1.3],[/elevacion|lateral|pajaro|face pull|facepull/,.5],[/inclinado|incline/,1.6],[/apertura|fly|cruce|contractor|pec deck/,.9],[/press banca|bench|press plano|press de pecho|chest press/,2],[/fondos|dip/,1.8],[/dominada|pull up|pullup|chin/,1.6],[/jalon|pulldown|remo|row/,1.9],[/rumano|rdl/,2.6],[/peso muerto|deadlift/,3.2],[/hip thrust|puente de gluteo/,3.5],[/sentadilla|squat/,2.8],[/prensa|leg press/,5.5],[/zancada|lunge|bulgara|split/,1.6],[/extension de cuadriceps|leg extension/,1.6],[/abdominal|crunch|plancha/,1]];
const refRatio=(k,big)=>{for(const [re,r] of REFS)if(re.test(k))return r;return big?1.6:1};
const bestsOf=(notes,cfg,extra)=>{const out={},put=(k,e)=>{if(k&&e>0&&(!out[k]||e>out[k]))out[k]=e};
 Object.entries((cfg&&cfg.bestGone)||{}).forEach(([k,e])=>put(k,e));
 notes.forEach(n=>{Object.entries(n.best||{}).forEach(([k,e])=>put(k,e));(n.hist||[]).forEach(h=>{if(h.demo)return;(h.ex||[]).forEach(x=>(x.s||[]).forEach(([kg,r])=>put(norm(x.n),e1(kg,r))))})});
 (extra||[]).forEach(x=>(x.s||[]).forEach(([kg,r])=>put(norm(x.n),e1(kg,r))));return out};
const muscleF=(bests,bw)=>{const mf={};Object.entries(bests).forEach(([k,e])=>{const d=detect(k),f=(e/bw)/refRatio(k,isBig(k));(d.ag||[]).forEach(g=>{if(MUS[g]&&g!=='other')mf[g]=Math.max(mf[g]||0,f)})});return mf};
const stepFp=fp=>{fp=Math.max(0,Math.min(1,fp));const raw=fp*25,step=Math.min(24,Math.floor(raw));return{step,fp,frac:step>=24?1:raw-step,tier:Math.min(8,Math.floor(step/3)),div:step%3+1}};
const stepOf=f=>stepFp((f-.08)/.92);
const rankName=r=>r.tier===8?'Radiante':RANKS[r.tier][0]+' '+r.div;
const bodyW=meas=>{const v=(meas||[]).filter(m=>typeof m.kg==='number'&&m.kg>30);return v.length?v[v.length-1].kg:0};
function RankBadge({r,size}){
 const c=RANKS[r.tier][1],h=size*1.1,rad=r.tier===8;
 return html`<svg width=${size} height=${h} viewBox="0 0 40 44" aria-hidden="true" style=${{flexShrink:0,filter:rad?'drop-shadow(0 0 6px rgba(255,220,120,.7))':'none'}}>
  <path d="M20 2 L36 8 V22 C36 33 28 40 20 43 C12 40 4 33 4 22 V8 Z" fill=${c} fillOpacity=${rad?.35:.2} stroke=${c} strokeWidth="2.2" strokeLinejoin="round"/>
  ${rad?html`<path d="M20 11l2.6 6.4 6.9.5-5.3 4.5 1.7 6.7L20 25.4 14.1 29l1.7-6.7-5.3-4.5 6.9-.5z" fill=${c}/>`
  :Array.from({length:r.div},(_,i)=>html`<path key=${i} d=${'M12 '+(30-i*7)+' L20 '+(23-i*7)+' L28 '+(30-i*7)} fill="none" stroke=${c} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>`)}
 </svg>`;
}
function RanksCard({notes,cfg,meas}){

    <div className="text-xs mut" style=${{marginTop:5}}>${has?(gr.step>=24?'Rango máximo':'Siguiente: '+rankName(stepFp((gr.step+1)/25+.0001))):'Termina un entreno con peso para ver tu rango'}</div>

  </div>`}
 </div>`;

const EXM=[['kg','Peso máx.','kg'],['e1','1RM est.','kg'],['vol','Volumen','kg']];
function exHistory(notes){
 const m={};
 notes.forEach(n=>(n.hist||[]).forEach(h=>{if(h.demo||h.dl)return;(h.ex||[]).forEach(e=>{const k=norm(e.n),s=(e.s||[]).filter(x=>x[0]>0&&x[1]>0);if(!k||!s.length)return;
  const top=s.reduce((a,x)=>x[0]>a[0]||(x[0]===a[0]&&x[1]>a[1])?x:a,s[0]);
  (m[k]=m[k]||{k,name:e.n,pts:[]}).pts.push({t:h.t,kg:top[0],r:top[1],e1:Math.round(Math.max(...s.map(x=>e1(x[0],x[1])))*10)/10,vol:Math.round(s.reduce((a,x)=>a+x[0]*x[1],0)),s})})}));
 return Object.values(m).map(x=>{x.pts.sort((a,b)=>a.t-b.t);x.name=x.pts.length?x.name:x.name;return x}).sort((a,b)=>b.pts.length-a.pts.length||a.name.localeCompare(b.name));
}
function ExerciseChart({notes}){

 const vs=pts.map(val),lo0=Math.min(...vs),hi0=Math.max(...vs),pad=(hi0-lo0)*.15||Math.max(1,hi0*.1);
 const step=(()=>{const r=(hi0-lo0+2*pad)/3,p=Math.pow(10,Math.floor(Math.log10(r||1))),n=r/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p})();
 const y0=Math.max(0,Math.floor((lo0-pad)/step)*step),y1=Math.ceil((hi0+pad)/step)*step||1;
 const t0=pts[0].t,t1=pts[pts.length-1].t,sp=t1-t0;

 return html`<div className="card p-4">

  <div style=${{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginTop:14}}>

  </div>

    <defs><linearGradient id="exg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#C6F432" stopOpacity=".28"/><stop offset="1" stopColor="#C6F432" stopOpacity="0"/></linearGradient></defs>
    ${ticks.map(v=>html`<g key=${v}><line x1=${L} x2=${W-R} y1=${Y(v)} y2=${Y(v)} stroke="#262626" strokeWidth="1"/><text x=${L-6} y=${Y(v)+3.5} textAnchor="end" fill="#6b7078" fontSize="10" className="num">${fmt(v)}</text></g>`)}

 const ser=n=>JSON.stringify(n);

 const saveDel=()=>{try{localStorage.setItem('gym-cloud-del',JSON.stringify(r.del))}catch(e){}};
 const setMeas=v=>{r.meas=v;setMeasS(v);try{localStorage.setItem('gym-meas',JSON.stringify(v))}catch(e){}};
 const keepCfg=c=>{r.cfg=c;setCfgS(c);try{localStorage.setItem('gym-cfg',JSON.stringify(c))}catch(e){}};

  if(!r.coll||!r.ready)return;
  const cur=r.notes,ops=[];
  cur.forEach(n=>{const x=ser(n);if(r.sent[n.id]!==x)ops.push(()=>r.coll.doc('n_'+n.id).set(JSON.parse(x)).then(()=>{r.sent[n.id]=x}))});
  [...r.del].forEach(id=>ops.push(()=>r.coll.doc('n_'+id).delete().then(()=>{r.del=r.del.filter(x=>x!==id);saveDel()})));
  if(!ops.length)return;

 };

  const snap=await r.coll.limit(500).get(),docs=snap.docs;
  const cloud=docs.map(d=>JSON.parse(JSON.stringify(d.data()))).filter(n=>n&&n.id&&Array.isArray(n.blocks));
  const hasMeta=docs.some(d=>d.id==='meta'),cd=docs.find(d=>d.id==='cfg'),cc=cd?JSON.parse(JSON.stringify(cd.data())):null;
  setMeas(docs.map(d=>d.data()).filter(x=>x&&x.kind==='measure'&&x.t).map(x=>JSON.parse(JSON.stringify(x))).sort((a,b)=>a.t-b.t));
  let known=[],seeds={};try{known=JSON.parse(localStorage.getItem('gym-cloud-ids')||'[]');seeds=JSON.parse(localStorage.getItem('gym-seed-ids')||'{}')}catch(e){}

  saveMeasure:async e=>{if(r.coll)await r.coll.doc('me_'+e.id).set(clone(e));setMeas(sortM([...r.meas.filter(x=>x.id!==e.id),e]))},

  }};
}

 const info=n=>{const e=n.blocks.filter(b=>b.type==='exercise').length,s=n.blocks.flatMap(b=>b.sets||[]);return e?`${e} ejercicios, ${s.length} series`:`${n.blocks.length} bloques`};
 const histTxt=n=>{const h=(n.hist||[]).filter(x=>!x.demo);return h.length?`Última vez ${ago(h[h.length-1].t)}, ${h.length} ${h.length===1?'sesión':'sesiones'}`:null};
 const inProg=n=>{const s=n.blocks.flatMap(b=>b.sets||[]),d=s.filter(x=>x.done).length;return d?`${d}/${s.length}`:null};
 const today=day0(Date.now());
 const days=Array.from({length:30},(_,k)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(29-k));return d.getTime()});
 const AC=activity(notes),act=AC.days;
 const Tile=(v,l)=>html`<div className="card p-4 text-center pop-in"><div className="text-2xl font-semibold num">${typeof v==='number'?html`<${CountUp} to=${v}/>`:v}</div><div className="text-sm mut">${l}</div></div>`;
 /* El gesto se escucha en toda la pantalla, también en el margen del borde */
 return html`<div className="mx-auto max-w-xl px-4 pt-6 min-h-screen" style=${{paddingBottom:note?96:'calc(env(safe-area-inset-bottom,0px) + 112px)'}} onTouchStart=${note?tStart:null} onTouchMove=${note?tMove:null} onTouchEnd=${note?tEnd:null} onTouchCancel=${note?tEnd:null}>
  ${note?html`<div key="editor" ref=${wrap} className="bg-black min-h-screen"><${Editor} key=${note.id} note=${note} all=${notes} cfg=${cfg} meas=${cloud.meas} dl=${dl} patch=${patch} onBack=${leave} onDup=${dup} onDel=${()=>{drop(aid);setAid(null);window.scrollTo(0,0)}}/></div>`:
  html`<div key=${'tab-'+tab} className=${'space-y-3 '+(tabDir>0?'push-in':'push-l')}>
   ${tab==='home'&&html`<div className="space-y-3">
   <div className="flex items-end justify-between gap-3 px-1 pb-1">
    <div className="min-w-0"><h1 className="pt-1"><${Logo}/></h1>
     <button onClick=${cloud.retry} className="mt-2 flex items-center gap-1.5 text-xs mut text-left"><span className=${'inline-block h-1.5 w-1.5 shrink-0 rounded-full '+(cloud.st==='ok'||cloud.mode==='local'?'bg-neutral-200':cloud.st==='syncing'?'bg-neutral-400 blink':'bg-neutral-600')}></span>${cloud.label}</button></div>
    <button onClick=${create} className="btn-w h-11 px-4 shrink-0 flex items-center gap-1.5 text-sm">${I(P.plus,16)}Nueva</button>
   </div>
   ${dl&&html`<div className="rounded-2xl bg-neutral-200 text-black px-4 py-3 text-sm pop-in"><b>Semana de descarga</b> · día ${Math.min(7,daysSince(cfg.deload)+1)} de 7. Mitad de series, −10 % de peso y RPE 6–7.</div>`}
   <${NextCard} notes=${notes} cfg=${cfg} setSel=${k=>cloud.setCfg({pinSel:k})} open=${open}/>
   <h2 className="text-xl font-semibold px-1 pt-3">Tus rutinas</h2>
   ${(allTags.includes('Rutina A')||allTags.includes('Rutina C')||allTags.includes('Antiguas'))&&html`<p className="text-xs mut px-1 -mt-1">${[allTags.includes('Rutina A')||allTags.includes('Rutina C')?'Rutina A (4 días) y Rutina C (3 días, para épocas de muchos exámenes), del PDF «Rutina de hipertrofia».':'',allTags.includes('Antiguas')?'Tus rutinas de antes están en «Antiguas», con su historial.':''].filter(Boolean).join(' ')}</p>`}
   ${day&&html`<div className="flex items-center justify-between px-1 text-sm"><span className="mut">Rutinas del ${new Date(day).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</span><button onClick=${()=>setDay(null)} className="text-neutral-300 underline">Quitar filtro</button></div>`}
   <input value=${q} onChange=${e=>setQ(e.target.value)} placeholder="Buscar rutina o etiqueta" className="field w-full h-12 px-4"/>
   ${allTags.length>0&&html`<div className="flex gap-2 flex-wrap">
    ${allTags.map(t=>html`<button key=${t} onClick=${()=>{setOrdering(false);setTag(ft===t?null:t)}} className=${'h-9 px-4 rounded-full text-sm '+(ft===t?'bg-neutral-200 text-black font-semibold':'chip mut')}>${t}</button>`)}
    <button onClick=${()=>{setOrdering(false);setTag(null)}} className=${'h-9 px-4 rounded-full text-sm '+(!ft?'bg-neutral-200 text-black font-semibold':'chip mut')}>Todas</button>
   </div>`}
   ${ft&&html`<div className="flex gap-2 flex-wrap items-center">
    <button onClick=${()=>togglePin(ft)} style=${AB}>${I(pinned.includes(ft)?P.x:P.arrU,15)}${pinned.includes(ft)?'Quitar de arriba':'Fijar arriba'}</button>
    <button onClick=${()=>setOrdering(o=>!o)} style=${ordering?ABon:AB}>${I(ordering?P.check:SORT,15)}${ordering?'Listo':'Ordenar días'}</button></div>`}
   <div className=${ordering&&ft?'space-y-3':'rlist'}>
    ${ordering&&ft&&tagList.map((n,i)=>html`<div key=${n.id} className="card p-4 flex items-center gap-3"><span className="mut" style=${{width:20,textAlign:'center'}}>${i+1}</span><span className="flex-1 min-w-0 truncate text-lg font-semibold">${n.title||'Sin título'}</span>
     <button aria-label="Subir" disabled=${i===0} onClick=${()=>moveDay(n.id,-1)} className="h-9 w-9 grid place-items-center rounded-full chip" style=${{opacity:i===0?.3:1}}>${I(P.up,18)}</button>
     <button aria-label="Bajar" disabled=${i===tagList.length-1} onClick=${()=>moveDay(n.id,1)} className="h-9 w-9 grid place-items-center rounded-full chip" style=${{opacity:i===tagList.length-1?.3:1}}>${I(P.down,18)}</button></div>`)}
    ${!(ordering&&ft)&&shown.map((n,ix)=>html`<button key=${n.id} onClick=${()=>open(n.id)} className="rrow">
     <div className="flex-1 min-w-0">
      <div className="flex items-center gap-2"><span className="rtitle truncate">${n.title||'Sin título'}</span>${inProg(n)&&html`<span className="shrink-0 rounded-full bg-neutral-200 text-black text-xs font-semibold px-2 py-0.5 num">En curso ${inProg(n)}</span>`}</div>
      <div className="rsub">${info(n)}${!ft&&n.tags.length>0?n.tags.map(t=>html`<span key=${t} className="rtag">${t}</span>`):''}</div>
      ${histTxt(n)&&html`<div className="rlast">${histTxt(n)}</div>`}</div>
     <span className="mut">${I(P.chev,18)}</span></button>`)}
    ${!(ordering&&ft)&&shown.length===0&&html`<p className="mut text-center py-8">${notes.length?'No hay rutinas con este filtro.':'Cargando tus rutinas…'}</p>`}
   </div>
   </div>`}
   ${tab==='prog'&&html`<div className="space-y-3">
   <h1 className="text-2xl font-semibold px-1" style=${{paddingTop:8}}>Progresión</h1>
   <${ProgCard} notes=${notes} open=${open} cfg=${cfg} onStartDl=${beginDl} onEndDl=${finishDl}/>
   <${RanksCard} notes=${notes} cfg=${cfg} meas=${cloud.meas}/>
   <${RankMap} notes=${notes} cfg=${cfg} meas=${cloud.meas}/>
   <${WeekChart} notes=${notes}/>
   <${ExerciseChart} notes=${notes}/>
   <div className="grid grid-cols-3 gap-3">${Tile(AC.w30,'entrenos · mes')}${Tile(AC.wS,'series · 7 d')}${Tile(fmtK(AC.wV),'kg · 7 d')}</div>
   <div className="card p-4">
    <div className="flex justify-between text-sm mb-3"><span className="mut">Últimos 30 días</span><span className="mut num">${days.filter(d=>act.has(d)).length} días activos</span></div>
    <div className="grid grid-cols-10 gap-1.5">${days.map((d,k)=>html`<button key=${d} aria-label=${new Date(d).toLocaleDateString('es-ES')} onClick=${()=>{setDay(day===d?null:d);if(day!==d){setTab('home');window.scrollTo(0,0)}}} style=${{animationDelay:k*14+'ms'}} className=${'pop-in h-6 rounded-md '+(act.has(d)?'bg-neutral-300':'bg-[#1f1f1f]')+(day===d?' ring-2 ring-white':d===today?' ring-1 ring-white/70':'')}></button>`)}</div>
    ${day&&html`<div className="flex items-center justify-between mt-3 text-sm"><span className="mut">En Inicio: rutinas del ${new Date(day).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</span><button onClick=${()=>setDay(null)} className="text-neutral-300 underline">Quitar filtro</button></div>`}
   </div>
   </div>`}
   ${tab==='meas'&&html`<div className="space-y-3">
   <h1 className="text-2xl font-semibold px-1" style=${{paddingTop:8}}>Medidas</h1>
   <${MeasureCard} ms=${cloud.meas} cloud=${cloud} cloudOk=${true} onNew=${()=>setPh('new')} onHist=${()=>setPh('hist')}/>
   </div>`}
   ${tab==='set'&&html`<div className="space-y-3">
   <h1 className="text-2xl font-semibold px-1" style=${{paddingTop:8}}>Ajustes</h1>
   <${BackupCard} cfg=${cfg} mode=${cloud.mode} msg=${bmsg} onExport=${doExport} onPick=${()=>fileRef.current&&fileRef.current.click()}/>
   <input ref=${fileRef} type="file" accept="application/json,.json" className="hidden" onChange=${pickFile}/>
   <${NotifCard} notes=${notes} cfg=${cfg}/>
   <${AtajoCard}/>
   <p className="text-xs mut px-1">${cloud.label}</p>
   </div>`}
  </div>`}
  ${!note&&html`<${TabBar} tab=${tab} setTab=${setTab}/>`}
  ${ask&&note&&html`<${ExitAsk} note=${note} onSave=${()=>{patch(n=>finishNote(n,dl));leaveNow()}} onLeave=${leaveNow} onStay=${()=>setAsk(false)}/>`}
  ${ph==='new'&&html`<${MeasureNew} ms=${cloud.meas} cloud=${cloud} close=${()=>setPh(null)}/>`}
  ${ph==='hist'&&html`<${MeasureHist} ms=${cloud.meas} cloud=${cloud} close=${()=>setPh(null)}/>`}
  ${imp&&html`<${Sheet} title="Importar copia" close=${()=>setImp(null)}>${shut=>html`<div className="space-y-3">
   <p className="text-sm text-neutral-300">Copia ${imp.t?'del '+fecha(imp.t)+' ('+ago(imp.t)+')':'sin fecha'}: ${imp.notes.length} rutinas y ${imp.meas.length} medidas.</p>
   <div className="rounded-2xl bg-neutral-200 text-black px-3 py-2.5 text-sm"><b>Ojo:</b> se reemplazan todos los datos que hay ahora en la app por los de la copia.</div>
   <button onClick=${()=>doImport(imp)} className="btn-w h-14 w-full">Reemplazar mis datos</button>
   <button onClick=${shut} className="h-11 w-full mut">Cancelar</button></div>`}<//>`}
 </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

<script>
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body></html>
